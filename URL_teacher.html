<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크 보내기 (교사용)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F8FB;
    --card: #FFFFFF;
    --ink: #2B3A55;
    --accent: #4A7DFF;
    --accent-dark: #3563D9;
    --mint: #7FD8C4;
    --muted: #8CA3C3;
    --danger: #FF6B6B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Jua', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .panel {
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 6px 24px rgba(43,58,85,0.10);
    padding: 32px 28px;
    width: 100%;
    max-width: 480px;
  }  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 22px; }

  /* ── 학년 선택 ── */
  .label { font-size: 15px; margin-bottom: 8px; display: block; }
  .grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .grade {
    font-family: 'Jua', sans-serif;
    font-size: 19px;
    padding: 14px 0;
    border: 2px solid var(--muted);
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .grade.on {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  /* ── 입력 ── */
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="url"], input[type="text"] {
    flex: 1;
    font-family: sans-serif;
    font-size: 15px;
    padding: 13px 14px;
    border: 2px solid var(--muted);
    border-radius: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .paste-btn {
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    padding: 0 16px;
    border: 2px solid var(--accent);
    border-radius: 14px;
    background: #EDF3FF;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }

  /* ── 전송 버튼 ── */
  .send-btn {
    width: 100%;
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    padding: 18px;
    margin-top: 6px;
    border: none;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-dark);
  }
  .send-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .send-btn:disabled { background: var(--muted); box-shadow: none; cursor: not-allowed; }
  .clear-btn {
    width: 100%;
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    padding: 13px;
    margin-top: 10px;
    border: 2px solid var(--danger);
    border-radius: 14px;
    background: #FFF3F3;
    color: var(--danger);
    cursor: pointer;
  }
  .clear-btn:active { background: #FFE2E2; }
  .clear-btn:disabled { border-color: var(--muted); color: var(--muted); background: #F5F5F5; cursor: not-allowed; }

  .credit {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
  }

  /* ── 상태/현재 링크 ── */
  #msg { min-height: 24px; margin-top: 14px; font-size: 15px; text-align: center; }
  #msg.ok { color: #2BA57A; }
  #msg.err { color: var(--danger); }
  .now {
    margin-top: 18px;
    background: #F0FAF7;
    border: 2px dashed var(--mint);
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
  }
  .now b { display: block; font-size: 15px; margin-bottom: 4px; }
  .now .u { font-family: sans-serif; font-size: 12px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>

<!-- ── 메인 전송 화면 ── -->
<div class="panel" id="main">
  <h1>📡 링크 보내기</h1>
  <div class="sub">학년을 고르고 링크를 보내면 학생 화면에 바로 나타납니다</div>

  <span class="label">받을 학년</span>
  <div class="grades" id="grades">
    <button class="grade" data-g="1">1학년</button>
    <button class="grade" data-g="2">2학년</button>
    <button class="grade" data-g="3">3학년</button>
    <button class="grade" data-g="4">4학년</button>
    <button class="grade" data-g="5">5학년</button>
    <button class="grade" data-g="6">6학년</button>
  </div>

  <span class="label">보낼 링크 (URL)</span>
  <div class="row">
    <input type="url" id="url" placeholder="https://...">
    <button class="paste-btn" id="pasteBtn">붙여넣기</button>
  </div>

  <span class="label">제목 (학생 화면에 크게 표시, 선택)</span>
  <div class="row">
    <input type="text" id="title" placeholder="예: 오토드로우 접속" maxlength="40">
  </div>

  <button class="send-btn" id="sendBtn">🚀 전송하기</button>
  <button class="clear-btn" id="clearBtn">🧹 링크 지우기 (대기 화면으로)</button>
  <div id="msg"></div>

  <div class="now" id="now" style="display:none;">
    <b id="nowTitle"></b>
    <span id="nowTime"></span>
    <div class="u" id="nowUrl"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { initializeFirestore, doc, getDocFromServer, setDoc, deleteDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCNl5OGGWMQwx6axvqP12oAUScRfavNlzw",
    authDomain: "class-link-3a434.firebaseapp.com",
    projectId: "class-link-3a434",
    storageBucket: "class-link-3a434.firebasestorage.app",
    messagingSenderId: "429666244390",
    appId: "1:429666244390:web:2fc9f7730787b1eeb313e7"
  };
  const app = initializeApp(firebaseConfig);
  // 학교망(필터링 장비)에서 연결이 지연될 때를 대비해 우회 방식(롱폴링) 강제 — 학생 페이지와 동일
  const db = initializeFirestore(app, { experimentalForceLongPolling: true });
  const $ = (id) => document.getElementById(id);

  // 페이지를 열자마자 백그라운드에서 서버 연결을 미리 맺어둠 (전송을 누를 때 이미 연결돼 있게 하여 첫 전송 지연 완화)
  getDocFromServer(doc(db, "links", "1")).catch(() => {});

  // ── 학년 선택 ──
  let grade = null;
  let unsub = null;

  function selectGrade(g) {
    const btn = document.querySelector(`.grade[data-g="${g}"]`);
    if (!btn) return;
    document.querySelectorAll(".grade").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    grade = g;
    try { localStorage.setItem("cl-grade", g); } catch (e) {}  // 마지막 학년 기억
    watchCurrent(g);
  }

  $("grades").addEventListener("click", (e) => {
    const btn = e.target.closest(".grade");
    if (!btn) return;
    selectGrade(btn.dataset.g);
  });

  // 페이지를 열 때: 지난번 선택했던 학년을 자동 선택
  try {
    const saved = localStorage.getItem("cl-grade");
    if (saved && ["1","2","3","4","5","6"].includes(saved)) selectGrade(saved);
  } catch (e) {}

  // 페이지를 열 때: 주소의 ?url= 값으로 입력칸 자동 채우기 (단축어 연동용)
  const pageParams = new URLSearchParams(location.search);
  const prefillUrl = pageParams.get("url");
  if (prefillUrl && /^https?:\/\/.+/.test(prefillUrl)) {
    $("url").value = prefillUrl;
    showMsg("링크가 자동으로 입력됐어요. 학년 확인 후 전송을 누르세요!", "ok");
  }

  // 선택한 학년의 현재 링크를 실시간 표시
  function watchCurrent(g) {
    if (unsub) unsub();
    unsub = onSnapshot(doc(db, "links", g), (snap) => {
      if (snap.exists() && snap.data().url) {
        const d = snap.data();
        $("now").style.display = "block";
        $("nowTitle").textContent = `📌 ${g}학년에 지금 떠 있는 링크: ${d.title || "(제목 없음)"}`;
        $("nowUrl").textContent = d.url;
        if (d.updatedAt && d.updatedAt.toDate) {
          const t = d.updatedAt.toDate();
          $("nowTime").textContent = `${t.getHours()}시 ${String(t.getMinutes()).padStart(2,"0")}분 전송됨`;
        } else {
          $("nowTime").textContent = "";
        }
      } else {
        $("now").style.display = "block";
        $("nowTitle").textContent = `📭 ${g}학년은 지금 대기 화면입니다`;
        $("nowUrl").textContent = "";
        $("nowTime").textContent = "";
      }
    });
  }

  // ── 붙여넣기 버튼 ──
  $("pasteBtn").onclick = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) $("url").value = t.trim();
    } catch {
      showMsg("붙여넣기 권한이 없어요. 길게 눌러 직접 붙여넣어 주세요.", "err");
    }
  };

  // ── 전송 ──
  $("sendBtn").onclick = () => {
    const url = $("url").value.trim();
    const title = $("title").value.trim();

    if (!grade) return showMsg("받을 학년을 먼저 선택해주세요", "err");
    if (!/^https?:\/\/.+/.test(url)) return showMsg("http:// 또는 https:// 로 시작하는 주소를 입력해주세요", "err");

    // 서버 확인을 기다리지 않고 즉시 화면 처리 (Firestore가 로컬에 먼저 기록 후 백그라운드로 서버 동기화)
    setDoc(doc(db, "links", grade), {
      url: url,
      title: title || "선생님이 보낸 링크",
      updatedAt: serverTimestamp()
    }).catch((err) => {
      console.error(err);
      showMsg("전송 실패: " + err.message + " (다시 눌러주세요)", "err");
    });

    showMsg(`✅ ${grade}학년으로 전송 완료!`, "ok");
    $("url").value = "";
    $("title").value = "";
  };

  // ── 링크 지우기 (학생 화면을 대기 상태로) ──
  $("clearBtn").onclick = () => {
    if (!grade) return showMsg("지울 학년을 먼저 선택해주세요", "err");

    deleteDoc(doc(db, "links", grade)).catch((err) => {
      console.error(err);
      showMsg("지우기 실패: " + err.message + " (다시 눌러주세요)", "err");
    });

    showMsg(`🧹 ${grade}학년 링크를 지웠어요. 학생 화면은 대기 상태가 됩니다.`, "ok");
  };

  function showMsg(text, cls) {
    const m = $("msg");
    m.textContent = text;
    m.className = cls;
  }
</script>
<div class="credit">ⓒ 조치원명동초등학교 디지털튜터</div>
</body>
</html>
