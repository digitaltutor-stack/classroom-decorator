<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>우리 반 링크</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6FF;        /* 하늘색 배경 */
    --card: #FFFFFF;
    --ink: #2B3A55;       /* 진한 남색 글자 */
    --accent: #FF8A5C;    /* 코랄 (버튼) */
    --accent-dark: #F2703F;
    --mint: #7FD8C4;
    --muted: #8CA3C3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua', sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  /* ── 상단 학급 배지 ── */
  .class-badge {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 3px solid var(--mint);
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 20px;
    box-shadow: 0 4px 0 rgba(43,58,85,0.08);
  }

  /* ── 학급 선택 화면 ── */
  #pick { display: none; width: 100%; max-width: 520px; }
  #pick h1 { font-size: 30px; margin-bottom: 6px; }
  #pick p  { font-size: 17px; color: var(--muted); margin-bottom: 24px; }
  .grade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .grade-btn {
    display: block;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 26px 0;
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 5px 0 var(--ink);
  }
  .grade-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }

  /* ── 대기 화면 ── */
  #waiting { display: none; }
  #waiting .emoji { font-size: 88px; display: block; margin-bottom: 18px; animation: floaty 2.6s ease-in-out infinite; }
  #waiting h1 { font-size: 28px; margin-bottom: 8px; }
  #waiting p  { font-size: 17px; color: var(--muted); }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  /* ── 링크 도착 화면 ── */
  #arrived { display: none; width: 100%; max-width: 640px; }
  .new-tag {
    display: inline-block;
    background: var(--mint);
    color: #fff;
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 18px;
    margin-bottom: 14px;
    animation: pop 0.5s ease;
  }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  #linkTitle { font-size: 30px; margin-bottom: 6px; word-break: keep-all; }
  #linkTime  { font-size: 15px; color: var(--muted); margin-bottom: 26px; }
  .go-btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 34px 20px;
    font-family: 'Jua', sans-serif;
    font-size: 34px;
    text-decoration: none;
    box-shadow: 0 8px 0 var(--accent-dark);
    animation: breathe 1.6s ease-in-out infinite;
  }
  .go-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--accent-dark); }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) {
    .go-btn, #waiting .emoji { animation: none; }
  }
  #linkUrl {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
    font-family: sans-serif;
  }

  /* ── 연결 상태 표시 ── */
  #status {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="class-badge" id="badge" style="display:none;"></div>

<!-- 학급 선택 (주소에 ?class= 가 없을 때만) -->
<div id="pick">
  <h1>🏫 우리 반을 골라요</h1>
  <p>한 번 고르면 다음부터는 바로 열려요</p>
  <div class="grade-grid">
    <a class="grade-btn" href="?class=1">1학년</a>
    <a class="grade-btn" href="?class=2">2학년</a>
    <a class="grade-btn" href="?class=3">3학년</a>
    <a class="grade-btn" href="?class=4">4학년</a>
    <a class="grade-btn" href="?class=5">5학년</a>
    <a class="grade-btn" href="?class=6">6학년</a>
  </div>
</div>

<!-- 대기 화면 -->
<div id="waiting">
  <span class="emoji">📬</span>
  <h1>선생님을 기다리는 중...</h1>
  <p>링크가 오면 화면이 바뀌어요!</p>
</div>

<!-- 링크 도착 화면 -->
<div id="arrived">
  <span class="new-tag">✨ 새 링크 도착!</span>
  <h1 id="linkTitle"></h1>
  <div id="linkTime"></div>
  <a class="go-btn" id="goBtn" href="#" target="_blank" rel="noopener">👆 눌러서 접속하기</a>
  <div id="linkUrl"></div>
</div>

<div id="status"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { initializeFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Firebase 연결 정보 (class-link 프로젝트) ──
  const firebaseConfig = {
    apiKey: "AIzaSyCNl5OGGWMQwx6axvqP12oAUScRfavNlzw",
    authDomain: "class-link-3a434.firebaseapp.com",
    projectId: "class-link-3a434",
    storageBucket: "class-link-3a434.firebasestorage.app",
    messagingSenderId: "429666244390",
    appId: "1:429666244390:web:2fc9f7730787b1eeb313e7"
  };

  const app = initializeApp(firebaseConfig);
  // 학교망(필터링 장비) 환경에서 실시간 연결이 막힐 때 자동으로 우회 방식 사용
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

  const $ = (id) => document.getElementById(id);

  // ── 학급 확인: 주소의 ?class=1~6 ──
  const params = new URLSearchParams(location.search);
  const classId = params.get("class");
  const valid = ["1","2","3","4","5","6"];

  if (!classId || !valid.includes(classId)) {
    // 학급이 지정 안 됨 → 선택 화면
    $("pick").style.display = "block";
  } else {
    // 학급 지정됨 → 수신 시작
    $("badge").textContent = `${classId}학년 교실`;
    $("badge").style.display = "block";
    $("waiting").style.display = "block";

    let firstLoad = true;
    const linkRef = doc(db, "links", classId);

    function render(snap) {
      if (!snap.exists() || !snap.data().url) {
        $("waiting").style.display = "block";
        $("arrived").style.display = "none";
        return;
      }

      const d = snap.data();
      $("waiting").style.display = "none";
      $("arrived").style.display = "block";
      $("linkTitle").textContent = d.title || "선생님이 보낸 링크";
      $("goBtn").href = d.url;
      $("linkUrl").textContent = d.url;

      if (d.updatedAt && d.updatedAt.toDate) {
        const t = d.updatedAt.toDate();
        $("linkTime").textContent =
          `${t.getHours()}시 ${String(t.getMinutes()).padStart(2,"0")}분에 도착`;
      } else {
        $("linkTime").textContent = "";
      }

      // 새 링크가 오면 도착 애니메이션 다시 재생
      if (!firstLoad) {
        const tag = document.querySelector(".new-tag");
        tag.style.animation = "none";
        void tag.offsetWidth;   // 애니메이션 리셋 트릭
        tag.style.animation = "pop 0.5s ease";
      }
      firstLoad = false;
    }

    onSnapshot(linkRef, (snap) => {
      $("status").textContent = "🟢 연결됨";
      render(snap);
    }, (err) => {
      $("status").textContent = "🔴 연결 오류 - 새로고침 해보세요";
      console.error(err);
    });

    // iPad가 잠자기/앱 전환 후 화면에 돌아온 순간, 재연결을 기다리지 않고 즉시 최신 링크 1회 확인
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        try {
          render(await getDoc(linkRef));
        } catch (e) {
          console.error(e);
        }
      }
    });
  }
</script>
</body>
</html>
