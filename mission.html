<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>도형 미션!</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Jua', sans-serif;
    background: #fff8f0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 별들 */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .bg-shape {
    position: absolute;
    font-size: 2rem;
    opacity: 0.12;
    animation: drift 6s ease-in-out infinite;
  }
  @keyframes drift {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(15deg); }
  }

  /* 전체 컨테이너 */
  .wrap {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
  }

  /* 헤더 */
  .header {
    width: 100%;
    background: linear-gradient(135deg, #ff6b9d, #ff9a3c);
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(255,107,157,0.3);
  }
  .header h1 { font-size: 2.2rem; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .header p { font-size: 1.1rem; color: rgba(255,255,255,0.9); margin-top: 6px; }

  /* 시작 화면 */
  #startScreen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; gap: 24px; width: 100%;
  }

  .start-card {
    background: white;
    border-radius: 28px;
    padding: 36px 32px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(255,107,157,0.15);
    border: 3px solid #ffe0ec;
    max-width: 460px; width: 100%;
  }
  .start-emoji { font-size: 5rem; display: block; margin-bottom: 16px; animation: bounce 1.5s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
  .start-card h2 { font-size: 1.8rem; color: #ff6b9d; margin-bottom: 10px; }
  .start-card p { font-size: 1.2rem; color: #888; line-height: 1.7; }

  .start-btn {
    font-family: 'Jua', sans-serif;
    font-size: 1.8rem;
    padding: 20px 60px;
    background: linear-gradient(135deg, #ff6b9d, #ff9a3c);
    color: white; border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,107,157,0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

  /* 미션 화면 */
  #missionScreen { display: none; width: 100%; padding: 24px 20px; }

  .progress-bar-wrap {
    max-width: 500px; margin: 0 auto 24px;
    background: #ffe0ec; border-radius: 50px; height: 16px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 50px;
    background: linear-gradient(90deg, #ff6b9d, #ff9a3c);
    transition: width 0.5s ease;
  }
  .progress-text {
    text-align: center; font-size: 1.1rem; color: #bbb; margin-bottom: 20px;
  }

  .mission-card {
    max-width: 500px; margin: 0 auto;
    background: white; border-radius: 32px;
    padding: 40px 32px; text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,0.1);
    border: 4px solid #ffe0ec;
    animation: cardIn 0.5s cubic-bezier(0.68,-0.55,0.27,1.55);
  }
  @keyframes cardIn {
    0% { transform: scale(0.7) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .mission-num { font-size: 1rem; color: #ddd; margin-bottom: 8px; }
  .mission-shape { font-size: 8rem; line-height: 1; margin: 16px 0; display: block; }
  .mission-title { font-size: 2.4rem; color: #333; margin-bottom: 12px; }
  .mission-desc { font-size: 1.3rem; color: #888; line-height: 1.7; margin-bottom: 32px; }

  .example-wrap {
    background: #fff8f0; border-radius: 20px;
    padding: 20px; margin-bottom: 32px;
  }
  .example-label { font-size: 1rem; color: #bbb; margin-bottom: 12px; }
  .example-items { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .example-item {
    background: white; border-radius: 16px;
    padding: 12px 16px; font-size: 1rem; color: #666;
    border: 2px solid #ffe0ec;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .example-item span:first-child { font-size: 2rem; }

  .found-btn {
    font-family: 'Jua', sans-serif;
    font-size: 1.6rem; padding: 18px 48px;
    border: none; border-radius: 50px;
    color: white; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    width: 100%;
  }

  /* 완료 화면 */
  #doneScreen {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; gap: 24px;
  }
  .done-card {
    max-width: 460px; width: 100%;
    background: white; border-radius: 32px;
    padding: 48px 32px; text-align: center;
    box-shadow: 0 12px 48px rgba(255,107,157,0.2);
    border: 4px solid #ffe0ec;
  }
  .done-emoji { font-size: 6rem; display: block; animation: spin 0.6s ease-out; }
  @keyframes spin { 0%{transform:rotate(-20deg) scale(0);} 100%{transform:rotate(0deg) scale(1);} }
  .done-card h2 { font-size: 2.2rem; color: #ff6b9d; margin: 16px 0 10px; }
  .done-card p { font-size: 1.3rem; color: #888; line-height: 1.7; }
  .found-list {
    margin: 24px 0; display: flex;
    flex-direction: column; gap: 12px;
  }
  .found-item {
    background: #fff8f0; border-radius: 16px;
    padding: 14px 20px; font-size: 1.3rem; color: #555;
    display: flex; align-items: center; gap: 12px;
    border: 2px solid #ffe0ec;
  }
  .restart-btn {
    font-family: 'Jua', sans-serif;
    font-size: 1.3rem; padding: 14px 36px;
    border: 3px solid #ffb3cc; border-radius: 50px;
    background: white; color: #ff6b9d; cursor: pointer;
  }

  /* 색종이 효과 */
  .confetti {
    position: fixed; top: -10px; z-index: 999;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="wrap">
  <div class="header">
    <h1>🔍 도형 미션!</h1>
    <p>교실에서 도형 모양 물건을 찾아봐요!</p>
  </div>

  <!-- 시작 화면 -->
  <div id="startScreen">
    <div class="start-card">
      <span class="start-emoji">🕵️</span>
      <h2>탐정이 되어봐요!</h2>
      <p>교실 안에서<br><strong>세모, 네모, 동그라미</strong> 모양<br>물건을 찾는 미션이에요!</p>
    </div>
    <button class="start-btn" onclick="startMission()">🚀 미션 시작!</button>
  </div>

  <!-- 미션 화면 -->
  <div id="missionScreen">
    <div class="progress-text" id="progressText">1 / 3 미션</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:33%"></div>
    </div>
    <div class="mission-card" id="missionCard">
      <!-- 동적 생성 -->
    </div>
  </div>

  <!-- 완료 화면 -->
  <div id="doneScreen">
    <div class="done-card">
      <span class="done-emoji">🎉</span>
      <h2>미션 완료!</h2>
      <p>세 가지 도형을 모두 찾았어요!<br>선생님 노트북으로 가서<br>사진을 찍어봐요! 📸</p>
      <div class="found-list" id="foundList"></div>
      <button class="restart-btn" onclick="restart()">🔄 다시 해볼래요</button>
    </div>
  </div>
</div>

<script>
const missions = [
  {
    shape: '🔺',
    title: '세모를 찾아라!',
    desc: '뾰족뾰족 삼각형 모양\n물건을 찾아봐요!',
    examples: [
      { emoji: '📐', name: '삼각자' },
      { emoji: '🍕', name: '피자조각' },
      { emoji: '⛺', name: '텐트' },
    ],
    color: '#ff6b6b',
    bg: 'linear-gradient(135deg, #ff6b6b, #ff9a9a)',
    border: '#ffb3b3',
  },
  {
    shape: '⬛',
    title: '네모를 찾아라!',
    desc: '반듯반듯 사각형 모양\n물건을 찾아봐요!',
    examples: [
      { emoji: '📚', name: '책' },
      { emoji: '📱', name: '태블릿' },
      { emoji: '🪟', name: '창문' },
    ],
    color: '#48c78e',
    bg: 'linear-gradient(135deg, #48c78e, #96e6c2)',
    border: '#b3f0d8',
  },
  {
    shape: '⭕',
    title: '동그라미를 찾아라!',
    desc: '동글동글 원 모양\n물건을 찾아봐요!',
    examples: [
      { emoji: '🕐', name: '시계' },
      { emoji: '⚽', name: '공' },
      { emoji: '🍪', name: '쿠키' },
    ],
    color: '#ffd60a',
    bg: 'linear-gradient(135deg, #ffd60a, #ffe97a)',
    border: '#fff0a0',
  },
];

let current = 0;
let foundItems = [];

// 배경 도형
const bg = document.getElementById('bg');
const bgShapes = ['🔺','⬛','⭕','🔷','🌟','✨'];
for (let i = 0; i < 20; i++) {
  const el = document.createElement('div');
  el.className = 'bg-shape';
  el.textContent = bgShapes[i % bgShapes.length];
  el.style.left = Math.random() * 100 + '%';
  el.style.top = Math.random() * 100 + '%';
  el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
  el.style.animationDelay = (Math.random() * 5) + 's';
  el.style.animationDuration = (4 + Math.random() * 4) + 's';
  bg.appendChild(el);
}

function startMission() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('missionScreen').style.display = 'block';
  showMission(0);
}

function showMission(idx) {
  const m = missions[idx];
  document.getElementById('progressText').textContent = `${idx+1} / ${missions.length} 미션`;
  document.getElementById('progressBar').style.width = `${((idx+1)/missions.length)*100}%`;

  const card = document.getElementById('missionCard');
  card.style.borderColor = m.border;
  card.innerHTML = `
    <div class="mission-num">미션 ${idx+1}</div>
    <span class="mission-shape">${m.shape}</span>
    <div class="mission-title" style="color:${m.color}">${m.title}</div>
    <div class="mission-desc">${m.desc.replace('\n','<br>')}</div>
    <div class="example-wrap">
      <div class="example-label">이런 물건들이 있어요!</div>
      <div class="example-items">
        ${m.examples.map(e => `
          <div class="example-item">
            <span>${e.emoji}</span>
            <span>${e.name}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <button class="found-btn" style="background:${m.bg};"
      onclick="foundIt(${idx})">
      ✅ 찾았어요!
    </button>
  `;

  // 카드 재애니메이션
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'cardIn 0.5s cubic-bezier(0.68,-0.55,0.27,1.55)';
}

function foundIt(idx) {
  foundItems.push(missions[idx]);
  if (idx < missions.length - 1) {
    current = idx + 1;
    showMission(current);
  } else {
    showDone();
  }
}

function showDone() {
  document.getElementById('missionScreen').style.display = 'none';
  const done = document.getElementById('doneScreen');
  done.style.display = 'flex';

  const list = document.getElementById('foundList');
  list.innerHTML = foundItems.map(m => `
    <div class="found-item">
      <span>${m.shape}</span>
      <span>${m.title.replace('를 찾아라!','')}</span>
      <span style="margin-left:auto">✅</span>
    </div>
  `).join('');

  // 색종이
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#ff6b9d','#ff9a3c','#ffd60a','#48c78e','#7c6fff','#ff6b6b'];
  const shapes = ['🎊','🎉','⭐','✨','🌟'];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = shapes[Math.floor(Math.random()*shapes.length)];
      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (1.5 + Math.random()*2) + 'rem';
      el.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 80);
  }
}

function restart() {
  current = 0;
  foundItems = [];
  document.getElementById('doneScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
}
</script>
</body>
</html>
