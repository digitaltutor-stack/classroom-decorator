    --bg:#fff7e0; --ink:#2b2b2b; --sub:#6b6457; --card:#ffffff;
    --yellow:#ffc928; --road:#3a3d44; --red:#ff5a4e; --green:#2fb36d; --blue:#3d8bfd;
    --line:#eadfc4; --off:#d9d4c7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:"Gowun Dodum",sans-serif; min-height:100vh; touch-action:manipulation}
  header{background:var(--road); color:#fff; padding:14px 16px 22px; position:relative}
  header::after{ /* 횡단보도 줄무늬 */
    content:""; position:absolute; left:0; right:0; bottom:0; height:10px;
    background:repeating-linear-gradient(90deg,#fff 0 28px,transparent 28px 48px);
  }
  header h1{font-family:"Jua",sans-serif; font-weight:400; margin:0; font-size:24px; display:flex; align-items:center; gap:8px}
  header .me{font-size:14px; opacity:.85; margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  header .me button{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:999px; padding:3px 10px; font:inherit; font-size:13px}
  main{max-width:720px; margin:0 auto; padding:20px 16px 60px}
  .card{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:22px 18px; box-shadow:0 4px 0 var(--line)}
  .center{text-align:center}
  .big{font-family:"Jua",sans-serif; font-size:26px; margin:6px 0 10px}
  .muted{color:var(--sub)}
  .light{width:74px; height:74px; margin:6px auto 4px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 8px #3a3d44, 0 0 24px var(--yellow); animation:blink 1.6s infinite}
  .light.go{background:var(--green); box-shadow:0 0 0 8px #3a3d44, 0 0 24px var(--green); animation:none}
  @keyframes blink{50%{opacity:.45}}
  .hlogo{width:40px; height:40px; flex:none; background:var(--logo) center/contain no-repeat}
  /* 대기 화면: 신호등 대신 로고 */
  .light:not(.go){width:200px; height:200px; margin:0 auto 6px; background:var(--logo) center/contain no-repeat; box-shadow:none; border-radius:0; animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}

  /* 이름 고르기 */
  .names{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-top:14px}
  .names button{font:inherit; font-size:18px; padding:14px 8px; border-radius:16px; border:2px solid var(--line); background:#fff; color:var(--ink)}
  .names button:active{transform:scale(.97)}
  .names button.locked{background:#f1ede3; color:#b3ab98; border-style:dashed}
  .confirm{display:flex; gap:10px; justify-content:center; margin-top:16px}
  .btn{font-family:"Jua",sans-serif; font-size:20px; border:none; border-radius:16px; padding:14px 22px; background:var(--blue); color:#fff; box-shadow:0 4px 0 #2a64c0}
  .btn.gray{background:#c9c3b6; box-shadow:0 4px 0 #a39d90}
  .btn:disabled{background:var(--off); box-shadow:none; color:#fff}
  .btn:active:not(:disabled){transform:translateY(3px); box-shadow:none}

  /* 평가 */
  .team-tag{display:inline-block; background:var(--yellow); border-radius:999px; padding:4px 14px; font-family:"Jua",sans-serif; font-size:16px}
  .team-name{font-family:"Jua",sans-serif; font-size:30px; margin:8px 0 2px}
  .item{border-top:2px dashed var(--line); padding:16px 0 6px}
  .item h3{font-family:"Jua",sans-serif; font-weight:400; font-size:21px; margin:0 0 2px}
  .item p{margin:0 0 10px; color:var(--sub); font-size:15px}
  .stars{display:flex; gap:6px; justify-content:space-between}
  .stars button{flex:1; background:none; border:none; padding:4px 0; font:inherit; color:var(--sub); font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px}
  .stars svg{width:48px; height:48px; max-width:100%}
  .stars svg path{fill:#ece6d6; stroke:#d5ccb4; stroke-width:1.5; transition:fill .15s}
  .stars button.on svg path{fill:var(--yellow); stroke:#e3a800}
  .stars button.pop svg{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.25)}}
  .submit-row{margin-top:18px; text-align:center}
  .err{color:var(--red); margin-top:10px; min-height:1.2em}
  .done-emoji{font-size:64px}

  /* 소리 버튼 */
  .snd{position:absolute; top:12px; right:14px; width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; font-size:20px}

  /* 배경 장식 (팝콘·필름릴) */
  .deco{position:fixed; pointer-events:none; z-index:0; opacity:.9}
  .deco.pop{left:-6px; bottom:-6px; width:120px}
  .deco.reel{right:-18px; top:120px; width:110px; animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{position:relative; z-index:1}
  @media (max-width:800px){ .deco{opacity:.35} }

  /* 필름 띠 카드 */
  .film{position:relative; padding-top:42px; padding-bottom:40px; overflow:hidden}
  .film::before,.film::after{content:""; position:absolute; left:0; right:0; height:24px;
    background:repeating-linear-gradient(90deg, transparent 0 8px, #fff7e0 8px 20px) 0 50%/100% 9px no-repeat #3a3d44}
  .film::before{top:0} .film::after{bottom:0}

  /* 슬레이트(클래퍼보드) */
  .slate{position:relative; width:230px; margin:0 auto 6px}
  .slate svg{display:block; width:100%; height:auto}
  .slate .stick{transform-box:view-box; transform-origin:14px 44px}
  .slate.clap .stick{animation:clap 1s ease-out both}
  @keyframes clap{0%,45%{transform:rotate(-26deg)} 62%{transform:rotate(0)} 74%{transform:rotate(-7deg)} 86%,100%{transform:rotate(0)}}
  .slate .board{position:absolute; left:8%; right:8%; top:40%; bottom:8%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff}
  .slate .board small{font-family:"Jua",sans-serif; font-size:13px; letter-spacing:2px; opacity:.7}
  .slate .board b{font-family:"Jua",sans-serif; font-weight:400; font-size:30px; line-height:1.1; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .slate .board i{font-style:normal; font-size:14px; opacity:.85; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* 평가 항목 아이콘 */
  .item{display:grid; grid-template-columns:56px 1fr; column-gap:12px; align-items:center}
  .item .ic{width:56px; height:56px; border-radius:18px; display:grid; place-items:center; grid-row:span 2}
  .item .ic svg{width:34px; height:34px}
  .item .ic.c0{background:#ff7aa8; box-shadow:0 3px 0 #e05688}
  .item .ic.c1{background:#ffb627; box-shadow:0 3px 0 #e0961a}
  .item .ic.c2{background:#3d8bfd; box-shadow:0 3px 0 #2a64c0}
  .item .stars{grid-column:1 / -1; margin-top:10px}
  .item.ok h3::after{content:" ✔"; color:var(--green)}
  .stars button.on span{color:#c98a00; font-weight:bold}
  .btn.go{background:#ff5a4e; box-shadow:0 4px 0 #d23a30}
  .fin .drum{font-family:"Jua",sans-serif; font-size:30px; margin:6px 0}
  .fin .drum span{display:inline-block; animation:hop .9s ease-in-out infinite}
  .fin .drum span:nth-child(2){animation-delay:.15s} .fin .drum span:nth-child(3){animation-delay:.3s}
  @keyframes hop{50%{transform:translateY(-10px) scale(1.15); color:#ff5a4e}}
  .btn.go:disabled{background:var(--off); box-shadow:none}

</style>
</head>
<body>
<header>
  <button class="snd" id="snd" aria-label="소리 켜기/끄기">🔊</button>
  <h1><span class="hlogo"></span>2026 산울광고팀 영상 시상식</h1>
  <div class="me" id="meBar" hidden><span id="meName"></span></div>
</header>
<svg class="deco pop" viewBox="0 0 120 130" aria-hidden="true">
  <g fill="#fff" stroke="#e8c27a" stroke-width="2"><circle cx="34" cy="40" r="15"/><circle cx="58" cy="30" r="17"/><circle cx="84" cy="40" r="15"/><circle cx="46" cy="52" r="14"/><circle cx="72" cy="52" r="14"/></g>
  <circle cx="58" cy="30" r="5" fill="#ffe08a"/><circle cx="36" cy="40" r="4" fill="#ffe08a"/>
  <path d="M22 56h76l-10 70H32z" fill="#fff"/>
  <path d="M22 56h15l5 70H32zM52 56h16l-1 70H53zM83 56h15l-10 70h-10z" fill="#ff5a4e"/>
  <path d="M22 56h76l-10 70H32z" fill="none" stroke="#c9372d" stroke-width="2.5"/>
</svg>
<svg class="deco reel" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="46" fill="#3a3d44"/><circle cx="50" cy="50" r="8" fill="#fff7e0"/>
  <g fill="#fff7e0"><circle cx="50" cy="24" r="11"/><circle cx="76" cy="50" r="11"/><circle cx="50" cy="76" r="11"/><circle cx="24" cy="50" r="11"/></g>
</svg>
<main id="app"><div class="card center"><p class="muted">연결 중이에요…</p></div></main>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, collection, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNl5OGGWMQwx6axvqP12oAUScRfavNlzw",
  authDomain: "class-link-3a434.firebaseapp.com",
  projectId: "class-link-3a434",
  storageBucket: "class-link-3a434.firebasestorage.app",
  messagingSenderId: "429666244390",
  appId: "1:429666244390:web:2fc9f7730787b1eeb313e7"
};
const CONTEST_ID = "psa2026";          // 선생님 화면과 같아야 해요
const ITEM_HINTS = [
  "광고가 전하려는 말이 잘 느껴졌나요?",
  "새롭고 재미있는 아이디어였나요?",
  "화면·소리·편집이 깔끔했나요?"
];
const STAR_LABEL = ["아쉬워요","조금 좋아요","좋아요","아주 좋아요","최고예요"];

const db = getFirestore(initializeApp(firebaseConfig));
const app = document.getElementById("app");
const ls = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k, v){ try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k) }catch(e){} }
};
// 이 기기의 고유 번호 (한 기기 = 한 사람)
let DEVICE = ls.get("psa_device");
if (!DEVICE) {
  DEVICE = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  ls.set("psa_device", DEVICE);
}

let contest = null;          // {teams, students, items, current, claimOpen}
let claims = new Map();      // 이름 -> 기기번호
let claimsLoaded = false;
let me = ls.get("psa_me");
let picked = null, pickErr = "", claiming = false;
let submitted = new Set();
let scores = [0,0,0], scoreTeam = null;
let sending = false, errMsg = "";
let unsubVotes = null, votesTeam = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>';
/* ── 효과음 (Web Audio, 파일 없이 만들어요) ── */
let AC = null, muted = ls.get("psa_mute") === "1";
function ac(){
  if (!AC) { const K = window.AudioContext || window.webkitAudioContext; if (!K) return null; AC = new K(); }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
document.addEventListener("pointerdown", ac, { passive: true });   // 첫 터치 때 소리 허용
const can = () => !muted && AC && AC.state === "running";
function tone(f, t, d, type = "sine", v = .25){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
}
let NB = null;
function noise(t, d, v = .3, hp = 1500){
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = "highpass"; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d + .05);
}
const sfx = {
  pop(v){ if (!can()) return; const t = AC.currentTime; tone(330 + v * 110, t, .14, "triangle", .3); tone(660 + v * 220, t + .03, .12, "sine", .12); },
  clap(){ if (!can()) return; const t = AC.currentTime + .45; noise(t, .14, .6, 1200); tone(784, t + .18, .2, "triangle", .22); tone(1175, t + .32, .35, "triangle", .22); },
  done(){ if (!can()) return; const t = AC.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .09, .3, "triangle", .25)); tone(1568, t + .38, .6, "sine", .12); },
  pick(){ if (!can()) return; const t = AC.currentTime; tone(880, t, .12, "sine", .2); tone(1320, t + .08, .18, "sine", .15); }
};
const sndBtn = document.getElementById("snd");
const paintSnd = () => sndBtn.textContent = muted ? "🔇" : "🔊";
sndBtn.onclick = () => { muted = !muted; ls.set("psa_mute", muted ? "1" : null); paintSnd(); if (!muted) { ac(); setTimeout(() => sfx.pick(), 50); } };
paintSnd();

/* ── 그림 ── */
const SLATE = `<svg viewBox="0 0 220 170" aria-hidden="true">
  <defs><clipPath id="stk"><rect x="10" y="18" width="200" height="26" rx="5"/></clipPath></defs>
  <rect x="10" y="50" width="200" height="112" rx="12" fill="#3a3d44"/>
  <path d="M10 50h200v14H10z" fill="#2b2e34"/>
  <g fill="#fff">${[0,1,2,3,4,5,6].map(i => `<path d="M${18+i*30} 50h15l-9 14h-15z"/>`).join("")}</g>
  <g class="stick"><rect x="10" y="18" width="200" height="26" rx="5" fill="#2b2e34"/>
    <g clip-path="url(#stk)" fill="#fff">${[0,1,2,3,4,5,6].map(i => `<path d="M${14+i*30} 18h15l-12 26h-15z"/>`).join("")}</g>
    <circle cx="16" cy="44" r="5" fill="#ffc928"/></g>
</svg>`;
const ICONS = [
  `<svg viewBox="0 0 48 48"><path d="M6 19h7l20-10v30L13 29H6z" fill="#fff"/><path d="M12 29l3 10h6l-3-10" fill="#fff"/><path d="M38 17q4 7 0 14M42 13q7 11 0 22" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 48 48"><path d="M24 6a13 13 0 0 0-7 24v5h14v-5A13 13 0 0 0 24 6z" fill="#fff"/><rect x="18" y="37" width="12" height="5" rx="2.5" fill="#fff"/><path d="M20 22l4 5 4-5" stroke="#ffb627" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 48 48"><circle cx="15" cy="12" r="6" fill="#fff"/><circle cx="29" cy="12" r="6" fill="#fff"/><rect x="5" y="19" width="30" height="20" rx="5" fill="#fff"/><path d="M35 25l9-5v18l-9-5z" fill="#fff"/></svg>`
];
let clapTeam = null;   // 클래퍼보드 '딱!'은 팀이 바뀔 때 한 번만

const fail = err => { app.innerHTML = `<div class="card center"><p class="big">연결이 안 돼요 😢</p><p class="muted">선생님께 알려주세요.<br><small>${esc(err.code)}</small></p></div>`; };

onSnapshot(doc(db, "psa_rating", CONTEST_ID), snap => {
  contest = snap.exists() ? snap.data() : null;
  watchVotes(); render();
}, fail);

onSnapshot(collection(db, "psa_rating", CONTEST_ID, "claims"), s => {
  claims = new Map(s.docs.map(d => [d.id, d.data().device]));
  claimsLoaded = true; render();
}, fail);

function watchVotes(){
  const cur = contest?.current || null;
  if (cur === votesTeam) return;
  if (unsubVotes) { unsubVotes(); unsubVotes = null; }
  votesTeam = cur; submitted = new Set();
  if (!cur) return;
  const q = query(collection(db, "psa_rating", CONTEST_ID, "votes"), where("team", "==", cur));
  unsubVotes = onSnapshot(q, s => { submitted = new Set(s.docs.map(d => d.data().student)); render(); });
}

function render(){
  if (!contest || !claimsLoaded) {
    app.innerHTML = `<div class="card center"><div class="light"></div><p class="big">선생님이 준비 중이에요</p></div>`;
    setMe(); return;
  }
  // 내 이름이 이 기기에 묶여 있는지 확인 (선생님이 풀어주면 다시 고르기)
  if (me && claims.get(me) !== DEVICE) { me = null; ls.set("psa_me", null); }
  if (!me) {
    // 이 기기로 이미 잡아둔 이름이 있으면 그걸로 복구
    for (const [name, dev] of claims) if (dev === DEVICE) { me = name; ls.set("psa_me", me); break; }
  }
  setMe();
  if (contest.current === "__done__") {   // 모든 평가 끝!
    app.innerHTML = `<div class="card center film fin">
      <div class="light"></div>
      <p class="big">모든 평가가 끝났어요! 🎬</p>
      <p class="muted" style="font-size:18px">평가해 준 우리 친구들, 정말 고마워요 💛</p>
      <div class="drum">🥁 <span>두근</span><span>두근</span><span>…</span></div>
      <p class="big" style="font-size:24px">과연 1위는 누구일까요?</p>
      <p class="muted">이제 <b>앞쪽 화면</b>을 봐 주세요 👀✨</p></div>`;
    return;
  }
  if (!me) return renderNames();

  const team = (contest.teams || []).find(t => t.id === contest.current);
  if (!team) {
    app.innerHTML = `<div class="card center"><div class="light"></div><p class="big">잠깐 기다려요!</p><p class="muted">선생님이 다음 영상을 틀어줄 거예요.<br>영상을 집중해서 봐요 👀</p></div>`;
    return;
  }
  if ((team.members || []).includes(me)) {   // 우리 모둠 영상
    app.innerHTML = `<div class="card center film"><div class="done-emoji">📣</div><p class="big">${esc(team.name)}은 우리 모둠 영상이에요!</p>
      <p class="muted" style="font-size:18px">자기 모둠은 평가하지 않아요.<br>친구들이 평가하는 동안 멋지게 응원해 주세요 👏</p></div>`;
    return;
  }
  if (submitted.has(me)) {
    app.innerHTML = `<div class="card center film"><div class="done-emoji">🍿</div><p class="big">${esc(team.name)} 평가 완료!</p><p class="muted">다음 영상을 기다려요.</p></div>`;
    return;
  }
  if (scoreTeam !== team.id) { scoreTeam = team.id; scores = [0,0,0]; errMsg = ""; }
  renderForm(team);
}

function setMe(){
  document.getElementById("meBar").hidden = !me;
  document.getElementById("meName").textContent = me ? `👤 ${me}` : "";
}

function renderNames(){
  const list = contest.students || [];
  if (!list.length) { app.innerHTML = `<div class="card center"><div class="light"></div><p class="big">명단을 준비 중이에요</p></div>`; return; }
  if (!contest.claimOpen) {
    app.innerHTML = `<div class="card center"><div class="light"></div><p class="big">조금만 기다려요</p><p class="muted">선생님이 이름 고르기를 열어줄 거예요.</p></div>`;
    return;
  }
  if (picked) {
    app.innerHTML = `<div class="card center"><p class="muted">내 이름이 맞나요?<br><b>한 번 고르면 바꿀 수 없어요!</b></p><p class="big" style="font-size:34px">${esc(picked)}</p>
      <div class="confirm"><button class="btn gray" id="no">아니요</button><button class="btn" id="yes" ${claiming ? "disabled" : ""}>${claiming ? "확인 중…" : "네, 맞아요!"}</button></div>
      <div class="err">${esc(pickErr)}</div></div>`;
    document.getElementById("no").onclick = () => { picked = null; pickErr = ""; render(); };
    document.getElementById("yes").onclick = claim;
    return;
  }
  app.innerHTML = `<div class="card"><p class="big center">내 이름을 눌러요</p>
    <div class="names">${list.map((n,i) => claims.has(n)
      ? `<button class="locked" disabled>🔒 ${esc(n)}</button>`
      : `<button data-i="${i}">${esc(n)}</button>`).join("")}</div>
    <p class="muted center" style="margin-top:14px;font-size:14px">내 이름이 🔒 잠겨 있으면 선생님께 말해요.</p></div>`;
  app.querySelectorAll(".names button[data-i]").forEach(b => b.onclick = () => { picked = list[+b.dataset.i]; pickErr = ""; render(); });
}

async function claim(){
  if (claiming) return;
  claiming = true; pickErr = ""; render();
  try {
    await setDoc(doc(db, "psa_rating", CONTEST_ID, "claims", picked), { student: picked, device: DEVICE, at: serverTimestamp() });
    me = picked; ls.set("psa_me", me); picked = null; sfx.pick();
  } catch (e) {
    pickErr = "이 이름은 고를 수 없어요. 선생님께 말해요.";
  }
  claiming = false; render();
}

function renderForm(team){
  const items = contest.items || ["메시지 전달력","창의성","영상 완성도"];
  const ready = scores.every(v => v > 0);
  const first = clapTeam !== team.id;
  if (first) { clapTeam = team.id; sfx.clap(); }
  app.innerHTML = `<div class="card film">
    <div class="center"><span class="team-tag">🎬 지금 평가할 영상</span>
      <div class="slate ${first ? "clap" : ""}">${SLATE}<div class="board"><small>SCENE</small><b>${esc(team.name)}</b>${team.title ? `<i>${esc(team.title)}</i>` : ""}</div></div></div>
    ${items.map((it, k) => `<div class="item ${scores[k] ? "ok" : ""}"><div class="ic c${k}">${ICONS[k]}</div><h3>${esc(it)}</h3><p>${esc(ITEM_HINTS[k] || "")}</p>
      <div class="stars" data-k="${k}">${[1,2,3,4,5].map(v => `<button data-v="${v}" class="${scores[k] >= v ? "on" : ""}" aria-label="${v}점">${STAR}<span>${STAR_LABEL[v-1]}</span></button>`).join("")}</div></div>`).join("")}
    <div class="submit-row"><button class="btn go" id="send" ${ready && !sending ? "" : "disabled"}>${sending ? "보내는 중…" : ready ? "🎬 평가 보내기" : "별을 모두 골라요"}</button>
      <div class="err">${esc(errMsg)}</div></div></div>`;
  app.querySelectorAll(".stars").forEach(row => {
    const k = +row.dataset.k;
    row.querySelectorAll("button").forEach(b => b.onclick = () => {
      scores[k] = +b.dataset.v; sfx.pop(scores[k]); renderForm(team);
      app.querySelector(`.stars[data-k="${k}"] button[data-v="${b.dataset.v}"]`)?.classList.add("pop");
    });
  });
  document.getElementById("send").onclick = () => send(team);
}

async function send(team){
  if (sending || submitted.has(me)) return;
  sending = true; errMsg = ""; renderForm(team);
  try {
    await setDoc(doc(db, "psa_rating", CONTEST_ID, "votes", team.id + "__" + me), {
      student: me, team: team.id, device: DEVICE, s: scores.slice(),
      total: scores[0] + scores[1] + scores[2], at: serverTimestamp()
    });
    submitted.add(me); sfx.done();
  } catch (e) {
    errMsg = e.code === "permission-denied" ? "이미 보냈거나, 지금은 보낼 수 없어요. 선생님께 알려주세요." : "전송이 안 됐어요. 다시 눌러 주세요.";
  }
  sending = false; render();
}
</script>
</body>
</html>
