<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가위바위보 AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #0d0d1a;
    color: #fff;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 12px;
  }

  /* 대기 화면 */
  #waiting { text-align: center; }
  .waiting-icon { font-size: 80px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.7; } }
  .waiting-title { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
  .waiting-sub { font-size: 17px; color: #8892a4; line-height: 1.7; }

  /* 로딩 */
  #loadingMsg { text-align: center; display: none; }
  .spinner { font-size: 48px; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .load-text { font-size: 18px; font-weight: 600; color: #a0b0c0; }

  /* 메인 화면 — 가로 레이아웃 */
  #main {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    gap: 8px;
  }

  /* 타이틀 */
  .title-row {
    text-align: center;
    flex-shrink: 0;
  }
  .title-row h1 { font-size: 22px; font-weight: 700; }
  .title-row p { font-size: 13px; color: #8892a4; margin-top: 2px; }

  /* 콘텐츠 영역 — 좌우 분할 */
  .content-row {
    display: flex;
    flex-direction: row;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  /* 왼쪽 — 웹캠 */
  .webcam-wrap {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #111;
    flex: 1.2;
    min-width: 0;
  }

  #webcam {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 웹캠 하단 결과 오버레이 */
  .result-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.88));
    padding: 24px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .result-emoji { font-size: 56px; line-height: 1; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
  .result-info { flex: 1; }
  .result-label { font-size: 34px; font-weight: 800; line-height: 1.1; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .result-conf { font-size: 15px; color: #c0d8f0; margin-top: 3px; font-weight: 600; }

  /* 오른쪽 — 확률 바 */
  .bars-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .bars-title {
    font-size: 14px;
    font-weight: 700;
    color: #8892a4;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .bars { display: flex; flex-direction: column; gap: 10px; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #13131f;
    border-radius: 14px;
    border: 2px solid transparent;
    transition: border-color 0.15s, background 0.15s;
  }
  .bar-row.active { border-color: #3a4a6a; background: #1a1a2e; }

  .bar-emoji { font-size: 28px; width: 36px; text-align: center; }
  .bar-label { font-size: 17px; font-weight: 700; width: 56px; color: #c0d0e0; }
  .bar-row.active .bar-label { color: #fff; }

  .bar-bg { flex: 1; height: 16px; background: #1a2a3a; border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; transition: width 0.15s ease; }
  .bar-fill.scissor { background: linear-gradient(90deg, #f59e0b, #fcd34d); }
  .bar-fill.rock    { background: linear-gradient(90deg, #6366f1, #a5b4fc); }
  .bar-fill.paper   { background: linear-gradient(90deg, #10b981, #6ee7b7); }
  .bar-fill.none    { background: linear-gradient(90deg, #64748b, #94a3b8); }

  .bar-pct { font-size: 16px; font-weight: 800; width: 44px; text-align: right; color: #e0e8f0; }
  .bar-row.active .bar-pct { color: #ffd700; }
</style>
</head>
<body>

<!-- 대기 화면 -->
<div id="waiting">
  <div class="waiting-icon">🤖</div>
  <div class="waiting-title">선생님을 기다리는 중...</div>
  <p class="waiting-sub">선생님이 모델을 전송하면<br>바로 시작돼요!</p>
</div>

<!-- 로딩 화면 -->
<div id="loadingMsg">
  <div class="spinner">⚙️</div>
  <div class="load-text">AI 모델 불러오는 중...</div>
</div>

<!-- 메인 화면 -->
<div id="main">
  <div class="title-row">
    <h1>🤖 가위바위보 AI</h1>
    <p>손 모양을 카메라에 보여주세요!</p>
  </div>

  <div class="content-row">
    <!-- 왼쪽: 웹캠 -->
    <div class="webcam-wrap">
      <canvas id="webcam"></canvas>
      <div class="result-overlay">
        <div class="result-emoji" id="resultEmoji">🤔</div>
        <div class="result-info">
          <div class="result-label" id="resultLabel">준비중...</div>
          <div class="result-conf" id="resultConf">손을 카메라에 보여주세요</div>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 확률 바 -->
    <div class="bars-wrap">
      <div class="bars-title">📊 AI가 보는 확률</div>
      <div class="bars" id="bars"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, getDocFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCNl5OGGWMQwx6axvqP12oAUScRfavNlzw",
    authDomain: "class-link-3a434.firebaseapp.com",
    projectId: "class-link-3a434",
    storageBucket: "class-link-3a434.firebasestorage.app",
    messagingSenderId: "429666244390",
    appId: "1:429666244390:web:2fc9f7730787b1eeb313e7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let model, webcam, isRunning = false;

  const EMOJI_MAP = { '가위': '✌️', '바위': '✊', '주먹': '✊', '보': '✋', '몰라요': '🤷' };
  const COLOR_MAP = { '가위': 'scissor', '바위': 'rock', '주먹': 'rock', '보': 'paper', '몰라요': 'none' };

  function getEmoji(label) {
    for (const key of Object.keys(EMOJI_MAP)) { if (label.includes(key)) return EMOJI_MAP[key]; }
    return '🤔';
  }
  function getColor(label) {
    for (const key of Object.keys(COLOR_MAP)) { if (label.includes(key)) return COLOR_MAP[key]; }
    return 'none';
  }

  async function startModel(url) {
    if (isRunning) return;
    document.getElementById('waiting').style.display = 'none';
    document.getElementById('loadingMsg').style.display = 'block';

    try {
      const finalUrl = url.endsWith('/') ? url : url + '/';
      model = await tmImage.load(finalUrl + 'model.json', finalUrl + 'metadata.json');

      const wrap = document.querySelector('.webcam-wrap');
      const w = wrap.clientWidth || 480;
      const h = wrap.clientHeight || 360;

      webcam = new tmImage.Webcam(w, h, true);
      await webcam.setup();
      await webcam.play();

      const canvas = document.getElementById('webcam');
      canvas.width = w;
      canvas.height = h;

      const barsDiv = document.getElementById('bars');
      barsDiv.innerHTML = '';
      const classNames = model.getClassLabels
        ? model.getClassLabels()
        : Array.from({length: model.getTotalClasses()}, (_, i) => `클래스 ${i+1}`);

      classNames.forEach((name, i) => {
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.id = `row-${i}`;
        row.innerHTML = `
          <div class="bar-emoji">${getEmoji(name)}</div>
          <div class="bar-label">${name}</div>
          <div class="bar-bg"><div class="bar-fill ${getColor(name)}" id="bar-${i}" style="width:0%"></div></div>
          <div class="bar-pct" id="pct-${i}">0%</div>
        `;
        barsDiv.appendChild(row);
      });

      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('main').style.display = 'flex';

      isRunning = true;
      window.requestAnimationFrame(loop);

    } catch(e) {
      document.getElementById('loadingMsg').innerHTML =
        `<div style="color:#f87171;font-size:16px;padding:20px;text-align:center;">❌ 모델을 불러오지 못했어요.<br>선생님께 알려주세요.</div>`;
      console.error(e);
    }
  }

  async function loop() {
    if (!isRunning) return;
    webcam.update();
    const canvas = document.getElementById('webcam');
    const ctx = canvas.getContext('2d');
    ctx.drawImage(webcam.canvas, 0, 0, canvas.width, canvas.height);

    const predictions = await model.predict(webcam.canvas);
    let maxProb = 0, maxLabel = '', maxIdx = 0;
    predictions.forEach((p, i) => {
      if (p.probability > maxProb) { maxProb = p.probability; maxLabel = p.className; maxIdx = i; }
    });

    document.getElementById('resultEmoji').textContent = getEmoji(maxLabel);
    document.getElementById('resultLabel').textContent = maxLabel;
    document.getElementById('resultConf').textContent = `확률: ${Math.round(maxProb * 100)}%`;

    predictions.forEach((p, i) => {
      const pct = Math.round(p.probability * 100);
      const bar = document.getElementById(`bar-${i}`);
      const pctEl = document.getElementById(`pct-${i}`);
      const row = document.getElementById(`row-${i}`);
      if (bar) bar.style.width = pct + '%';
      if (pctEl) pctEl.textContent = pct + '%';
      if (row) row.classList.toggle('active', i === maxIdx);
    });

    window.requestAnimationFrame(loop);
  }

  const modelRef = doc(db, 'rsp_model', 'current');

  try {
    const snap = await getDocFromServer(modelRef);
    if (snap.exists() && snap.data().url && !isRunning) startModel(snap.data().url);
  } catch(e) {}

  onSnapshot(modelRef, (snap) => {
    if (snap.exists() && snap.data().url && !isRunning) startModel(snap.data().url);
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && !isRunning) {
      try {
        const snap = await getDocFromServer(modelRef);
        if (snap.exists() && snap.data().url) startModel(snap.data().url);
      } catch(e) {}
    }
  });
</script>
</body>
</html>
