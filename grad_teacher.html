  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Gowun Dodum",sans-serif}
  header{background:var(--navy); color:#fff; padding:14px 20px 24px; position:relative; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  header::after{content:""; position:absolute; left:0; right:0; bottom:0; height:10px; background:repeating-linear-gradient(90deg,var(--lime) 0 30px,transparent 30px 52px)}
  header h1{font-family:"Jua",sans-serif; font-weight:400; margin:0; font-size:24px}
  .clsbar{display:flex; gap:6px; background:var(--navy2); padding:5px; border-radius:14px}
  .clsbar button{font-family:"Jua",sans-serif; font-size:18px; border:none; border-radius:10px; padding:7px 14px; background:transparent; color:#cfd6ee; cursor:pointer}
  .clsbar button.on{background:var(--coral); color:#fff}
  nav{display:flex; gap:6px; margin-left:auto}
  nav button{font-family:"Jua",sans-serif; font-size:17px; border:none; border-radius:12px; padding:8px 16px; background:#3a4670; color:#fff; cursor:pointer}
  nav button.on{background:var(--lime); color:var(--ink)}
  main{max-width:1100px; margin:0 auto; padding:20px}
  .card{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; margin-bottom:16px}
  h2{font-family:"Jua",sans-serif; font-weight:400; margin:0 0 12px; font-size:22px}
  .muted{color:var(--sub)} small.muted{font-size:13px}
  .btn{font-family:"Jua",sans-serif; font-size:17px; border:none; border-radius:12px; padding:10px 16px; background:var(--blue); color:#fff; cursor:pointer}
  .btn.gray{background:#c9c2b2; color:var(--ink)} .btn.red{background:var(--red)} .btn.green{background:var(--green)} .btn.yellow{background:var(--lime); color:var(--ink)} .btn.navy{background:var(--navy)}
  .btn:disabled{opacity:.45; cursor:default}
  .teams{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
  .team{border:2px solid var(--line); border-radius:14px; padding:12px; background:#fffdf6; cursor:pointer; text-align:left; font:inherit}
  .team b{font-family:"Jua",sans-serif; font-weight:400; font-size:20px; display:block}
  .team.live{border-color:var(--green); background:#e9f9ef; box-shadow:0 0 0 3px #bfeccf}
  .team .cnt{font-size:14px; color:var(--sub)}
  .live-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .dot{width:14px; height:14px; border-radius:50%; background:var(--green); animation:bl 1.2s infinite} @keyframes bl{50%{opacity:.3}}
  .bar{height:16px; background:#efe8d6; border-radius:99px; overflow:hidden; flex:1; min-width:160px}
  .bar i{display:block; height:100%; background:var(--green); transition:width .3s}
  /* 모둠별 접속 현황 */
  .joins{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px}
  .jcol{border:2px solid var(--line); border-radius:14px; padding:10px; background:#fffdf6}
  .jcol h3{font-family:"Jua",sans-serif; font-weight:400; margin:0 0 6px; font-size:19px; display:flex; justify-content:space-between; align-items:baseline}
  .jcol h3 b{font-size:28px; color:var(--navy)}
  .jcol.bad{border-color:var(--red); background:#fff1ef}
  .chips{display:flex; flex-wrap:wrap; gap:4px}
  .chip{font-size:13px; padding:3px 7px; border-radius:8px; background:#eef1f8; color:#3a4670; cursor:pointer; border:none; font-family:inherit}
  .chip.arm{background:var(--red); color:#fff}
  .chip.ok{background:#dff5e7; color:#1d7a47}
  .chip.wait{background:#f3eee2; color:#9a927f; cursor:default}
  table{width:100%; border-collapse:collapse; font-size:17px}
  th,td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:center}
  th{font-weight:400; color:var(--sub); font-size:14px}
  td.name{text-align:left; font-family:"Jua",sans-serif; font-size:19px}
  tr.first td{background:#f6fccf}
  textarea,input[type=text]{width:100%; font:inherit; font-size:16px; border:2px solid var(--line); border-radius:12px; padding:10px; background:#fffdf6}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px} @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px} @media(max-width:760px){.grid3{grid-template-columns:1fr}}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px}
  .stepper{display:flex; align-items:center; gap:12px}
  .stepper button{font-family:"Jua",sans-serif; font-size:26px; width:48px; height:48px; border-radius:14px; border:none; background:var(--navy); color:#fff; cursor:pointer}
  .stepper b{font-family:"Jua",sans-serif; font-size:40px; min-width:60px; text-align:center}
  .tlist{display:grid; gap:8px; margin-top:12px}
  .tlist label{display:flex; gap:10px; align-items:center}
  .tlist label span{font-family:"Jua",sans-serif; font-size:18px; width:66px; flex:none}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:12px; opacity:0; transition:.3s; pointer-events:none; z-index:20}
  .toast.show{opacity:1}
  .hideBox{text-align:center; padding:40px 16px; border:3px dashed var(--line); border-radius:16px; background:#fffdf6}
  .big2{font-family:"Jua",sans-serif; font-size:24px; margin:6px 0}
  .warn{color:#b3261e}

  /* 발표 화면 */
  #stage{position:fixed; inset:0; background:var(--navy); color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10; padding:30px; overflow:hidden; text-align:center}
  #stage.show{display:flex}
  #stage > *{position:relative; z-index:2}
  #stage h1{font-family:"Jua",sans-serif; font-weight:400; font-size:44px; margin:0 0 24px}
  #stage .slogo{width:200px; height:200px; margin-bottom:8px; background:var(--logo) center/contain no-repeat}
  #stage.won h1{display:none} #stage.won .slogo{width:110px; height:110px}
  .hlogo{width:44px; height:44px; flex:none; background:var(--logo) center/contain no-repeat}
  .stage-ctl{position:absolute !important; bottom:20px; display:flex; gap:10px; z-index:3}
  #stage .spot{position:absolute; z-index:1; top:-20%; width:46vw; height:150%; opacity:0; transition:opacity .6s;
    background:linear-gradient(to bottom, rgba(230,255,170,.5), rgba(230,255,170,0) 75%); clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
  #stage .spot.l{left:2vw; transform-origin:50% 0; animation:swing 2.2s ease-in-out infinite alternate}
  #stage .spot.r{right:2vw; transform-origin:50% 0; animation:swing 2.2s ease-in-out infinite alternate-reverse}
  #stage.lit .spot{opacity:1}
  @keyframes swing{from{transform:rotate(-24deg)} to{transform:rotate(24deg)}}
  #stage::before{content:""; position:absolute; left:0; right:0; top:0; height:26px; z-index:1;
    background:repeating-linear-gradient(90deg,#000 0 18px,transparent 18px 36px), #26335a; opacity:.6}
  #stage::after{content:""; position:absolute; left:0; right:0; bottom:0; height:26px; z-index:1;
    background:repeating-linear-gradient(90deg,#000 0 18px,transparent 18px 36px), #26335a; opacity:.6}
  .sc{min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; width:min(1000px,100%)}
  .sc-msg{font-family:"Jua",sans-serif; font-size:56px; line-height:1.25; animation:zoom .5s both}
  .sc-msg small{display:block; font-size:28px; opacity:.8}
  @keyframes zoom{from{opacity:0; transform:scale(.4)} 70%{transform:scale(1.08)}}
  .cnt{font-family:"Jua",sans-serif; font-size:200px; line-height:1; color:var(--lime); text-shadow:0 0 40px rgba(205,242,75,.7); animation:cnt .8s both}
  @keyframes cnt{from{opacity:0; transform:scale(2.4)} 40%{opacity:1; transform:scale(1)} to{opacity:.2; transform:scale(.8)}}
  .roul{font-family:"Jua",sans-serif; font-size:84px; padding:26px 60px; border-radius:28px; background:var(--navy2); border:6px dashed var(--lime); min-width:60%}
  .shake{animation:shake .12s infinite}
  @keyframes shake{25%{transform:translate(-4px,2px)} 50%{transform:translate(3px,-3px)} 75%{transform:translate(-2px,-2px)}}
  .win{background:var(--lime); color:var(--ink); border-radius:32px; padding:24px 70px 30px; box-shadow:0 0 80px rgba(205,242,75,.8); animation:winpop .9s cubic-bezier(.2,1.6,.4,1) both}
  .win .crown{font-size:90px; line-height:1; animation:bob2 1.2s ease-in-out infinite}
  .win .lbl{font-family:"Jua",sans-serif; font-size:34px; color:#4d6300}
  .win .wn{font-family:"Jua",sans-serif; font-size:96px; line-height:1.1}
  .win .wt{font-size:28px; margin-top:4px}
  .congrats{font-family:"Jua",sans-serif; font-size:48px; margin-top:20px; animation:zoom .6s .6s both}
  @keyframes winpop{from{transform:scale(0) rotate(-12deg)}}
  @keyframes bob2{50%{transform:translateY(-10px) rotate(6deg)}}
  nav #bgm.on{background:var(--coral); color:#fff}
  .stage-ctl .btn:disabled{opacity:.5}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:11}
</style>
</head>
<body>
<header>
  <span class="hlogo"></span><h1 id="htitle">졸업영상 시상식 · 선생님</h1>
  <div class="clsbar" id="clsbar"></div>
  <nav><button data-tab="run" class="on">진행</button><button data-tab="result">결과</button><button data-tab="setup">설정</button><button id="bgm" title="모둠 고를 때·기다릴 때 전자칠판에서 틀어요">🎵 대기음악</button></nav>
</header>
<main id="app"><div class="card">연결 중…</div></main>
<div id="stage"></div><canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, getDocs, writeBatch, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNl5OGGWMQwx6axvqP12oAUScRfavNlzw",
  authDomain: "class-link-3a434.firebaseapp.com",
  projectId: "class-link-3a434",
  storageBucket: "class-link-3a434.firebasestorage.app",
  messagingSenderId: "429666244390",
  appId: "1:429666244390:web:2fc9f7730787b1eeb313e7"
};
const ROOT = "psa_rating";            // 기존 시상식과 같은 곳 (학생 화면과 같아야 해요)
const LIVE_ID = "grad2026-live";
const PREFIX = "grad2026-";
const LIVE_DEFAULT = { cls: "c1", classes: ["1반","2반","3반"], title: "졸업영상 시상식" };
const mkTeams = n => Array.from({ length: n }, (_, i) => ({ id: "t" + (i + 1), name: (i + 1) + "모둠", title: "" }));
// 자리표: 모둠마다 SLOTS개 (예: t3-04 = 3모둠의 4번째 기기). 학생이 모둠을 고르면 빈 자리표를 하나 잡아요.
const SLOTS = 15;
const mkSlots = teams => teams.flatMap(t => Array.from({ length: SLOTS }, (_, i) => t.id + "-" + String(i + 1).padStart(2, "0")));
const HINTS = ["우리의 6학년 이야기가 잘 느껴졌나요?","시작·중간·끝 흐름이 자연스러웠나요?","화면·소리·자막이 깔끔했나요?"];
const DEFAULT = {
  teams: mkTeams(4),
  students: mkSlots(mkTeams(4)),
  items: ["주제 전달","이야기 흐름","영상 완성도"],
  meta: { hints: HINTS },
  current: null,
  claimOpen: false
};

const db = getFirestore(initializeApp(firebaseConfig));
const liveRef = doc(db, ROOT, LIVE_ID);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tag = slot => String(slot || "").split("-")[1] || "?";

let L = null, clsId = null, C = null, votes = [], joins = [];
let contestRef = null, votesCol = null, claimsCol = null, unsubs = [];
let tab = "run", showTable = false, tableArm = false, resetArm = false, releaseArm = null, draft = null;

const fail = err => { app.innerHTML = `<div class="card"><h2>Firebase 연결 실패</h2><p>${esc(err.code)} — 보안 규칙(Rules)을 확인해 주세요.</p></div>`; };

onSnapshot(liveRef, async snap => {
  if (!snap.exists()) { try { await setDoc(liveRef, { meta: LIVE_DEFAULT }); } catch (e) { fail(e); } return; }
  L = { ...LIVE_DEFAULT, ...(snap.data().meta || {}) };
  document.title = (L.title || "졸업영상 시상식") + " - 선생님";
  document.getElementById("htitle").textContent = (L.title || "졸업영상 시상식") + " · 선생님";
  paintClassBar();
  if (L.cls !== clsId) openClass(L.cls); else render();
}, fail);

function paintClassBar(){
  const bar = document.getElementById("clsbar");
  bar.innerHTML = (L.classes || []).map((n, i) => `<button data-c="c${i + 1}" class="${L.cls === "c" + (i + 1) ? "on" : ""}">${esc(n)}</button>`).join("");
  bar.querySelectorAll("button").forEach(b => b.onclick = async () => {
    if (b.dataset.c === L.cls) return;
    try { await updateDoc(liveRef, { meta: { cls: b.dataset.c, classes: L.classes, title: L.title } }); toast(b.textContent + "으로 바꿨어요 — 학생 화면도 같이 바뀌어요"); } catch (e) { toast("실패: " + e.code); }
  });
}

function openClass(id){
  unsubs.forEach(u => u()); unsubs = [];
  clsId = id; C = null; votes = []; joins = []; draft = null; releaseArm = null; resetArm = false; showTable = false;
  const cid = PREFIX + id;
  contestRef = doc(db, ROOT, cid);
  votesCol = collection(db, ROOT, cid, "votes");
  claimsCol = collection(db, ROOT, cid, "claims");
  unsubs.push(onSnapshot(contestRef, async snap => {
    if (!snap.exists()) { try { await setDoc(contestRef, DEFAULT); } catch (e) { fail(e); } return; }
    C = { ...DEFAULT, ...snap.data() };
    if (!(C.students || []).length) { try { await updateDoc(contestRef, { students: mkSlots(C.teams || []) }); } catch (e) {} return; } if (tab !== "setup" || !draft) render();
  }, fail));
  unsubs.push(onSnapshot(votesCol, s => { votes = s.docs.map(d => d.data()); if (tab !== "setup") render(); }));
  unsubs.push(onSnapshot(claimsCol, s => { joins = s.docs.map(d => ({ slot: d.id, device: d.data().device, team: d.id.split("-")[0] })); if (tab !== "setup") render(); }));
  render();
}

document.querySelectorAll("nav button[data-tab]").forEach(b => b.onclick = () => {
  tab = b.dataset.tab; resetArm = false; showTable = false; tableArm = false; draft = null;
  document.querySelectorAll("nav button[data-tab]").forEach(x => x.classList.toggle("on", x === b)); render();
});

function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }

/* ── 계산: 기기가 고른 모둠으로 '자기 모둠 제외' ── */
const slotTeam = slot => String(slot || "").split("-")[0];
const validTeam = id => (C.teams || []).some(t => t.id === id);
const voters = t => joins.filter(j => j.team !== t.id && validTeam(j.team));   // 그 모둠을 평가할 기기
function stats(){
  const items = C.items || DEFAULT.items;
  const rows = (C.teams || []).map(t => {
    const v = votes.filter(x => x.team === t.id && slotTeam(x.student) !== t.id);   // 자기 모둠 표는 빼요
    const n = v.length, sum = v.reduce((a, x) => a + (x.total || 0), 0);
    const per = items.map((_, k) => n ? v.reduce((a, x) => a + (x.s?.[k] || 0), 0) / n : 0);
    return { ...t, n, sum, avg: n ? sum / n : 0, per, expect: voters(t).length };
  });
  rows.sort((a, b) => b.avg - a.avg);
  rows.forEach((r, i) => r.rank = i && Math.abs(r.avg - rows[i-1].avg) < 1e-9 ? rows[i-1].rank : i + 1);
  return rows;
}

function render(){
  if (!L || !C) return;
  if (tab === "run") renderRun(); else if (tab === "result") renderResult(); else renderSetup();
}

function renderRun(){
  const teams = C.teams || [];
  const cur = teams.find(t => t.id === C.current);
  const clsName = L.classes?.[+clsId.slice(1) - 1] || "";

  // ① 모둠 고르기
  const byTeam = {}; teams.forEach(t => byTeam[t.id] = []);
  const stray = [];
  joins.forEach(j => byTeam[j.team] ? byTeam[j.team].push(j) : stray.push(j));
  const counts = teams.map(t => byTeam[t.id].length);
  const avg = joins.length / Math.max(teams.length, 1);
  const odd = t => byTeam[t.id].length && (byTeam[t.id].length > avg * 1.8 + 1);   // 유난히 많은 모둠
  const chip = j => `<button class="chip ${releaseArm === j.slot ? "arm" : ""}" data-dev="${esc(j.slot)}" title="눌러서 풀기">${releaseArm === j.slot ? "↩ 풀까요?" : "#" + tag(j.slot)}</button>`;
  const claimCard = `<div class="card"><div class="live-head">
      <h2 style="margin:0">① 모둠 고르기 <small class="muted">${esc(clsName)}</small></h2>
      <b>접속 ${joins.length}대</b>
      <button class="btn ${C.claimOpen ? "red" : "green"}" id="claimToggle">${C.claimOpen ? "모둠 고르기 닫기" : "모둠 고르기 열기"}</button></div>
    <p class="muted" style="margin:8px 0 0">${C.claimOpen
      ? "학생들이 지금 모둠을 고를 수 있어요. 모두 골랐으면 <b>닫아 주세요</b>."
      : "닫혀 있어요. 이미 고른 기기는 그대로 평가할 수 있어요."}
      번호표는 학생 화면 위쪽에 "3-04"(3모둠 4번)처럼 보여요. 잘못 고른 기기는 번호표를 <b>두 번</b> 누르면 다시 고를 수 있어요.</p>
    <div class="joins">${teams.map(t => `<div class="jcol ${odd(t) ? "bad" : ""}"><h3>${esc(t.name)}<b>${byTeam[t.id].length}</b></h3>
        <div class="chips">${byTeam[t.id].map(chip).join("") || `<span class="muted" style="font-size:13px">아직 없어요</span>`}</div></div>`).join("")}
      ${stray.length ? `<div class="jcol bad"><h3>없는 모둠<b>${stray.length}</b></h3><div class="chips">${stray.map(chip).join("")}</div></div>` : ""}</div>
    ${teams.some(odd) ? `<p class="warn" style="margin:8px 0 0">⚠️ 빨간 모둠은 인원이 유난히 많아요. "○모둠 손 들어 볼까?"로 한 번 확인해 보세요.</p>` : ""}
    <div class="row"><button class="btn gray" id="releaseAll">${releaseArm === "*ALL*" ? "정말 모두 풀까요? 한 번 더 누르기" : "모둠 선택 모두 풀기"}</button></div></div>`;

  // ② 평가
  let live = C.current === "__done__"
    ? `<div class="live-head"><h2 style="margin:0">🏁 모든 평가 끝!</h2><button class="btn gray" id="undone">평가 다시 열기</button></div>
       <p class="muted">학생 화면에 "모든 평가가 끝났어요!"가 떠 있어요. <b>결과 → 🏆 발표 화면</b>으로 가세요.</p>`
    : `<div class="live-head"><p class="muted" style="margin:0;flex:1">아래에서 모둠을 누르면 학생 화면에 그 모둠 평가지가 열려요.</p>
       <button class="btn yellow" id="finish">🏁 모든 평가 끝내기</button></div>`;
  if (cur) {
    const done = new Set(votes.filter(v => v.team === cur.id).map(v => v.student));
    const vs = voters(cur), n = vs.filter(j => done.has(j.slot)).length;
    const lbl = j => +j.team.slice(1) + "-" + tag(j.slot);
    live = `<div class="live-head"><span class="dot"></span><h2 style="margin:0">지금 평가 중: ${esc(cur.name)}</h2>
        <div class="bar"><i style="width:${vs.length ? n / vs.length * 100 : 0}%"></i></div>
        <b>${n} / ${vs.length}대</b><button class="btn red" id="close">평가 닫기</button></div>
      <div class="chips" style="margin-top:10px">${vs.map(j => `<span class="chip ${done.has(j.slot) ? "ok" : "wait"}">${done.has(j.slot) ? "✅" : "⏳"} ${lbl(j)}</span>`).join("")}
        ${byTeam[cur.id]?.length ? `<span class="chip wait" style="background:#e7ecfb;color:#3a4670">🎬 ${esc(cur.name)} ${byTeam[cur.id].length}대는 응원 중</span>` : ""}</div>`;
  }
  app.innerHTML = `${claimCard}<div class="card"><h2 style="margin-bottom:8px">② 영상 평가</h2>${live}</div>
    <div class="card"><h2>모둠 목록</h2><div class="teams">${teams.map(t => {
      const c = votes.filter(v => v.team === t.id && slotTeam(v.student) !== t.id).length;
      return `<button class="team ${t.id === C.current ? "live" : ""}" data-id="${t.id}"><b>${esc(t.name)}</b>${t.title ? `<span>${esc(t.title)}</span><br>` : ""}<span class="cnt">평가 ${c}대</span></button>`;
    }).join("")}</div></div>`;

  app.querySelectorAll(".team").forEach(b => b.onclick = () => updateDoc(contestRef, { current: b.dataset.id }));
  document.getElementById("close")?.addEventListener("click", () => updateDoc(contestRef, { current: null }));
  document.getElementById("finish")?.addEventListener("click", () => updateDoc(contestRef, { current: "__done__", claimOpen: false }));
  document.getElementById("undone")?.addEventListener("click", () => updateDoc(contestRef, { current: null }));
  document.getElementById("claimToggle").onclick = () => updateDoc(contestRef, { claimOpen: !C.claimOpen });
  app.querySelectorAll(".chip[data-dev]").forEach(el => el.onclick = async () => {
    const d = el.dataset.dev;
    if (releaseArm !== d) { releaseArm = d; render(); setTimeout(() => { if (releaseArm === d) { releaseArm = null; render(); } }, 4000); return; }
    releaseArm = null;
    try { await deleteDoc(doc(claimsCol, d)); toast(+slotTeam(d).slice(1) + "-" + tag(d) + " 풀었어요 — 그 기기에서 다시 고르면 돼요"); } catch (e) { toast("실패: " + e.code); }
  });
  document.getElementById("releaseAll").onclick = async () => {
    if (releaseArm !== "*ALL*") { releaseArm = "*ALL*"; render(); return; }
    releaseArm = null;
    try { await wipe(claimsCol); toast("모두 풀었어요"); } catch (e) { toast("실패: " + e.code); }
  };
}

async function wipe(col){
  const all = await getDocs(col);
  for (let i = 0; i < all.docs.length; i += 400) { const b = writeBatch(db); all.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
}

function renderResult(){
  const items = C.items || DEFAULT.items, rows = stats();
  const fmt = x => (Math.round(x * 100) / 100).toString();
  app.innerHTML = `<div class="card"><div class="row" style="margin:0 0 12px; justify-content:space-between">
      <h2 style="margin:0">순위표 <small class="muted">${esc(L.classes?.[+clsId.slice(1) - 1] || "")}</small></h2>
      <div class="row" style="margin:0"><span class="muted">순위 기준: 평균 (자기 모둠 제외)</span>
        <button class="btn yellow" id="show">🏆 발표 화면</button></div></div>
    ${showTable ? `<div class="row" style="margin:0 0 10px"><button class="btn gray" id="hideT">🙈 순위표 숨기기</button></div>
    <table><tr><th>순위</th><th style="text-align:left">모둠</th><th>평가한 기기</th>${items.map(i => `<th>${esc(i)}<br>(평균)</th>`).join("")}<th>합계</th><th>평균<br>(15점 만점)</th></tr>
    ${rows.map(r => `<tr class="${r.rank === 1 && r.n ? "first" : ""}"><td>${r.rank === 1 && r.n ? "🥇" : r.rank}</td><td class="name">${esc(r.name)}${r.title ? `<br><small class="muted" style="font-family:'Gowun Dodum'">${esc(r.title)}</small>` : ""}</td>
      <td>${r.n} / ${r.expect}</td>${r.per.map(p => `<td>${fmt(p)}</td>`).join("")}<td>${r.sum}</td><td><b>${fmt(r.avg)}</b></td></tr>`).join("")}</table>`
    : `<div class="hideBox"><div style="font-size:54px">🙈</div><p class="big2">순위표가 가려져 있어요</p>
        <p class="muted">전자칠판에 연결돼 있다면 학생들에게 보일 수 있어요.<br>버튼을 <b>두 번</b> 눌러야 펼쳐져요.</p>
        <button class="btn ${tableArm ? "red" : "gray"}" id="showT">${tableArm ? "정말 펼칠까요? 한 번 더 누르기" : "👀 순위표 보기"}</button></div>`}
    <p class="muted" style="margin-top:12px">💡 자기 모둠에 준 점수는 빠지고, 모둠마다 평가 인원이 달라서 <b>평균</b>으로 순위를 매겨요.</p></div>`;
  document.getElementById("show").onclick = () => { showTable = false; tableArm = false; openStage(); };
  document.getElementById("hideT")?.addEventListener("click", () => { showTable = false; render(); });
  document.getElementById("showT")?.addEventListener("click", () => {
    if (!tableArm) { tableArm = true; render(); setTimeout(() => { if (tableArm && !showTable) { tableArm = false; render(); } }, 4000); return; }
    tableArm = false; showTable = true; render();
  });
}

function renderSetup(){
  if (!draft) draft = {
    teams: (C.teams || []).map(t => ({ ...t })),
    items: [...(C.items || DEFAULT.items)], hints: [...(C.meta?.hints || HINTS)],
    title: L.title || "", classes: (L.classes || []).join(", ")
  };
  const n = draft.teams.length;
  const clsName = L.classes?.[+clsId.slice(1) - 1] || "";
  app.innerHTML = `<div class="grid2">
    <div class="card"><h2>${esc(clsName)} 모둠 수</h2>
      <p class="muted" style="margin-top:0">반마다 따로 저장돼요. 영상 제목은 비워 둬도 돼요.</p>
      <div class="stepper"><button id="minus">−</button><b>${n}</b><button id="plus">＋</button><span class="muted">모둠</span></div>
      <div class="tlist">${draft.teams.map((t, i) => `<label><span>${esc(t.name)}</span><input type="text" data-i="${i}" class="ttl" placeholder="영상 제목 (선택)" value="${esc(t.title)}"></label>`).join("")}</div>
      <small class="muted">⚠️ 평가를 시작한 뒤에는 모둠 수를 줄이지 마세요.</small></div>
    <div class="card"><h2>평가 항목 (각 1~5점)</h2>
      ${draft.items.map((it, k) => `<div style="margin-bottom:12px"><input type="text" class="it" data-k="${k}" value="${esc(it)}" style="font-family:Jua;font-size:18px">
        <input type="text" class="hi" data-k="${k}" value="${esc(draft.hints[k] || "")}" placeholder="학생 화면에 보일 설명" style="margin-top:6px;font-size:14px"></div>`).join("")}</div></div>
    <div class="card"><h2>모든 반 공통</h2><div class="grid2">
      <label>시상식 제목<input type="text" id="title" value="${esc(draft.title)}" placeholder="예) 2026 산울초 6학년 졸업영상 시상식"></label>
      <label>반 이름 (쉼표로 구분)<input type="text" id="classes" value="${esc(draft.classes)}" placeholder="1반, 2반, 3반"></label></div>
      <div class="row"><button class="btn green" id="save">💾 저장하기</button><span class="muted">저장해야 학생 화면에 반영돼요.</span></div></div>
    <div class="card"><h2>${esc(clsName)} 기록 지우기</h2><p class="muted">이 반의 <b>점수와 모둠 선택</b>을 모두 지워요. 되돌릴 수 없어요. (다른 반은 그대로예요)</p>
      <button class="btn ${resetArm ? "red" : "gray"}" id="reset">${resetArm ? "정말 지울까요? 한 번 더 누르면 삭제돼요" : `${esc(clsName)} 지우기 (점수 ${votes.length}건 · 접속 ${joins.length}대)`}</button></div>`;

  const keep = () => {
    app.querySelectorAll(".ttl").forEach(el => draft.teams[+el.dataset.i].title = el.value);
    app.querySelectorAll(".it").forEach(el => draft.items[+el.dataset.k] = el.value);
    app.querySelectorAll(".hi").forEach(el => draft.hints[+el.dataset.k] = el.value);
    draft.title = document.getElementById("title").value; draft.classes = document.getElementById("classes").value;
  };
  const resize = m => {
    keep();
    const next = Math.min(10, Math.max(2, draft.teams.length + m));
    const base = mkTeams(next);
    draft.teams = base.map((t, i) => draft.teams[i] ? { ...draft.teams[i] } : t);
    render();
  };
  document.getElementById("minus").onclick = () => resize(-1);
  document.getElementById("plus").onclick = () => resize(1);
  document.getElementById("save").onclick = async () => {
    keep();
    const teams = draft.teams.map((t, i) => ({ id: "t" + (i + 1), name: (i + 1) + "모둠", title: t.title.trim() }));
    const items = draft.items.map((x, k) => x.trim() || DEFAULT.items[k]);
    const hints = draft.hints.map(x => x.trim());
    const classes = draft.classes.split(/[,，]/).map(s => s.trim()).filter(Boolean).slice(0, 8);
    try {
      await updateDoc(contestRef, { teams, students: mkSlots(teams), items, meta: { hints } });
      const liveUpd = { cls: L.cls, title: draft.title.trim() || LIVE_DEFAULT.title, classes: classes.length ? classes : LIVE_DEFAULT.classes };
      if (+clsId.slice(1) > liveUpd.classes.length) liveUpd.cls = "c1";
      await updateDoc(liveRef, { meta: liveUpd });
      draft = null; toast("저장했어요 ✅"); render();
    } catch (e) { toast("저장 실패: " + e.code); }
  };
  document.getElementById("reset").onclick = async () => {
    if (!resetArm) { resetArm = true; render(); return; }
    resetArm = false;
    try { await wipe(votesCol); await wipe(claimsCol); await updateDoc(contestRef, { current: null, claimOpen: false }); toast("지웠어요"); }
    catch (e) { toast("삭제 실패: " + e.code); }
    render();
  };
}

/* ── 소리 (Web Audio, 파일 없이 만들어요) ── */
let AC = null, OUT = null, NB = null;
function ac(){
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext; if (!K) return null;
    AC = new K();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    OUT = AC.createGain(); OUT.gain.value = 1; OUT.connect(comp); comp.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
document.addEventListener("pointerdown", ac, { passive: true });
function env(g, t, v, a, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function tone(f, t, d, type = "sine", v = .2){
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  env(g, t, v, .01, d); o.connect(g); g.connect(OUT); o.start(t); o.stop(t + d + .1);
}
function noise(t, d, v, type = "highpass", fr = 1500){
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = type; f.frequency.value = fr; env(g, t, v, .005, d);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t, Math.random()); s.stop(t + d + .1);
}
function brass(f, t, d, v = .16){   // 트럼펫 느낌
  const g = AC.createGain(), lp = AC.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(700, t); lp.frequency.linearRampToValueAtTime(3200, t + .06);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .04);
  g.gain.setValueAtTime(v, t + Math.max(.05, d - .12)); g.gain.exponentialRampToValueAtTime(.0001, t + d + .25);
  [-6, 6].forEach(dt => { const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(t); o.stop(t + d + .3); });
  lp.connect(g); g.connect(OUT);
}
const SFX = {
  drumroll(dur, big){       // 두구두구
    const t0 = AC.currentTime + .05;
    for (let x = 0; x < dur; x += .045) noise(t0 + x, .06, (big ? .25 : .18) + (big ? .45 : .25) * (x / dur), "bandpass", 1800);
    return dur * 1000;
  },
  reveal(){                 // 딩동!
    const t = AC.currentTime; noise(t, .25, .35, "highpass", 3000);
    tone(784, t, .5, "triangle", .3); tone(1175, t + .1, .7, "triangle", .3); tone(1568, t + .2, .9, "sine", .15);
  },
  fanfare(){               // 1위 팡파레 (크게!)
    const t = AC.currentTime;
    noise(t, 2.6, .9, "highpass", 4500);                         // 심벌
    tone(65, t, .6, "sine", .9);                                   // 큰북
    const N = [[392,.13],[523,.13],[659,.13],[784,.4],[659,.13],[784,1.4]];
    let x = .05; N.forEach(([f, d]) => { brass(f, t + x, d, .2); brass(f / 2, t + x, d, .1); x += d; });
    const end = t + .97;                                           // 마지막 화음
    [523, 659, 784, 1047].forEach(f => brass(f, end, 1.5, .12));
    tone(65, end, .8, "sine", .9); noise(end, 2.4, .7, "highpass", 5000);
    for (let i = 0; i < 70; i++) noise(end + .3 + Math.random() * 2.6, .05, .08 + Math.random() * .12, "bandpass", 1500 + Math.random() * 2500);  // 박수
  },
  riser(dur){              // 긴장감 올라가는 소리
    const t = AC.currentTime, o = AC.createOscillator(), lp = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(900, t + dur);
    lp.type = "lowpass"; lp.frequency.setValueAtTime(400, t); lp.frequency.exponentialRampToValueAtTime(4000, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + dur); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .15);
    o.connect(lp); lp.connect(g); g.connect(OUT); o.start(t); o.stop(t + dur + .2);
  },
  boom(v){                  // 쿵!
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + .4);
    env(g, t, .9 * v, .005, .5); o.connect(g); g.connect(OUT); o.start(t); o.stop(t + .6);
    noise(t, .15, .3 * v, "lowpass", 400);
  },
  tick(){ const t = AC.currentTime; tone(1400, t, .05, "square", .06); },
  chime(){ const t = AC.currentTime; [523, 784, 1047].forEach((f, i) => tone(f, t + i * .12, .6, "triangle", .2)); }
};

/* 대기음악: 은은하고 밝은 졸업 느낌 (직접 지은 멜로디, 파일 없이 연주) */
const NOTE = n => 440 * Math.pow(2, ({C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}[n[0]] + (+n[1] - 4) * 12) / 12);
// 한 마디 = 8칸(8분음표). 0은 앞 음을 이어서 울리게 둬요.
const MEL = [
  "E5",0,0,"G5","E5",0,"D5","C5",   "D5",0,0,0,"B4",0,"D5",0,
  "C5",0,0,"E5","C5",0,"B4","A4",   "B4",0,0,0,"G4",0,0,0,
  "A4",0,0,"C5","A4",0,"G4","F4",   "G4",0,"C5",0,"E5",0,0,0,
  "F5",0,"E5","D5","C5",0,"A4",0,   "D5",0,0,"B4","D5",0,0,0,
  "G5",0,0,"E5","G5",0,"C6",0,      "B5",0,"A5","G5","D5",0,0,0,
  "E5",0,0,"C5","E5",0,"A5",0,      "G5",0,0,0,"E5",0,"B4",0,
  "A5",0,"G5","F5","C5",0,"F5",0,   "E5",0,0,0,"G5",0,"E5",0,
  "D5",0,"F5",0,"E5",0,"D5",0,      "C5",0,0,0,0,0,0,0
];
// 마디마다 화음: [베이스, 아르페지오 3음]
const CH = { C:["C3","C4","E4","G4"], G:["G2","B3","D4","G4"], Am:["A2","A3","C4","E4"], Em:["E3","G3","B3","E4"], F:["F2","A3","C4","F4"] };
const PROG = ["C","G","Am","Em","F","C","F","G", "C","G","Am","Em","F","C","G","C"];
const ARP = [0,1,2,1,3,1,2,1];        // 화음 음을 물결처럼 오르내려요
const STEP = .32;                     // 한 칸 길이(초) — 느긋한 빠르기
function soft(f, t, d, v){            // 부드럽게 커졌다 사라지는 깔림음
  const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + d * .35); g.gain.linearRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t + d + .05);
}
function keys(f, t, d, v){            // 피아노·오르골 느낌: 또렷하게 울리고 천천히 사라져요
  tone(f, t, d, "sine", v); tone(f, t, d * .45, "triangle", v * .3); tone(f * 2, t, d * .5, "sine", v * .22);
}
let bgmOn = false, bgmTimer = null, bgmStep = 0, bgmNext = 0;
function bgmTick(){
  while (bgmNext < AC.currentTime + .3) {
    const i = bgmStep % MEL.length, bar = Math.floor(i / 8), k = i % 8, ch = CH[PROG[bar]];
    if (MEL[i]) {                                   // 멜로디: 다음 음이 나올 때까지 길게 울려요
      let hold = 1; while (hold < 8 && !MEL[(i + hold) % MEL.length]) hold++;
      keys(NOTE(MEL[i]), bgmNext, STEP * hold + .5, .15);
    }
    const a = ARP[k];                               // 아르페지오 (3은 첫 음을 한 옥타브 위로)
    tone(NOTE(ch[1 + a % 3]) * (a === 3 ? 2 : 1), bgmNext, .7, "sine", .05);
    if (k === 0) {                                  // 마디 첫 박: 베이스 + 깔림 화음
      tone(NOTE(ch[0]), bgmNext, STEP * 8, "sine", .13);
      ch.slice(1).forEach(n => soft(NOTE(n), bgmNext, STEP * 8.4, .022));
    }
    bgmStep++; bgmNext += STEP;
  }
}
function setBgm(on){
  bgmOn = on; document.getElementById("bgm").classList.toggle("on", on);
  clearInterval(bgmTimer);
  if (on) { ac(); bgmStep = 0; bgmNext = AC.currentTime + .1; bgmTimer = setInterval(bgmTick, 100); }
}
document.getElementById("bgm").onclick = () => setBgm(!bgmOn);

/* ── 발표 화면: 1위만 공개 (호들갑 연출) ── */
let stageRows = [], running = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function openStage(){
  stageRows = stats().filter(r => r.n);
  if (!stageRows.length) { toast("아직 점수가 없어요"); return; }
  setBgm(false); ac(); SFX.chime();
  const st = document.getElementById("stage");
  st.className = "show";
  st.innerHTML = `<div class="spot l"></div><div class="spot r"></div>
    <div class="slogo"></div><h1>${esc(L.title || "졸업영상 시상식")}</h1>
    <div class="sc" id="sc"><div class="sc-msg">🎬 최고의 졸업영상은?<small>모두 앞을 봐 주세요!</small></div></div>
    <div class="stage-ctl"><button class="btn yellow" id="go" style="font-size:24px;padding:14px 26px">🥁 1위 발표 시작!</button><button class="btn gray" id="exit">닫기</button></div>`;
  document.getElementById("go").onclick = runShow;
  document.getElementById("exit").onclick = () => { running = false; st.className = ""; };
}
async function runShow(){
  if (running) return; running = true; ac();
  const st = document.getElementById("stage"), sc = document.getElementById("sc");
  document.getElementById("go").remove();
  const say = (html, cls = "sc-msg") => { if (running) sc.innerHTML = `<div class="${cls}">${html}</div>`; };
  const winners = stageRows.filter(r => r.rank === 1);
  const names = stageRows.map(r => r.name);

  st.classList.add("lit"); SFX.riser(2.6);
  say("📣 지금부터<br>1위를 발표하겠습니다!!"); await sleep(2300); if (!running) return;
  say("과연… 영광의 1위는?!<small>두근두근 💓 두근두근 💓</small>"); SFX.boom(.5); await sleep(2200); if (!running) return;
  for (const n of [3, 2, 1]) { say(n, "cnt"); SFX.boom(1); await sleep(850); if (!running) return; }

  // 팀 이름 룰렛 (점점 느려지며 멈춤)
  sc.innerHTML = `<div class="roul" id="roul">?</div>`; st.classList.add("shake");
  const rl = document.getElementById("roul");
  SFX.drumroll(4.6, true);
  let d = 55, k = Math.floor(Math.random() * names.length), tTot = 0;
  while (tTot < 4300 && running) {
    rl.textContent = names.length > 1 ? names[k++ % names.length] : "? ? ?";
    SFX.tick(); await sleep(d); tTot += d; d = Math.min(d * 1.09, 420);
  }
  if (!running) return;
  st.classList.remove("shake");
  rl.textContent = "…"; await sleep(500); if (!running) return;

  // 짜잔!
  const title = winners.length === 1 && winners[0].title ? `<div class="wt">「${esc(winners[0].title)}」</div>` : "";
  sc.innerHTML = `<div class="win"><div class="crown">🏆</div><div class="lbl">${winners.length > 1 ? "공동 1위" : "1위"}</div>
    <div class="wn">${winners.map(w => esc(w.name)).join(" & ")}</div>${title}</div>
    <div class="congrats">🎉 축하합니다!! 🎉</div>`;
  st.classList.add("won");
  SFX.fanfare(); confetti(); setTimeout(confetti, 1300); setTimeout(confetti, 2800);
  running = false;
}

let PS = [], fxRun = false;
function confetti(){
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#cdf24b","#ff6f61","#ffffff","#3d8bfd","#ffc928","#b388ff"];
  for (let k = 0; k < 200; k++) PS.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, w: 6 + Math.random() * 7, c: cols[Math.random() * cols.length | 0] });
  if (fxRun) return; fxRun = true;
  (function tick(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    PS = PS.filter(p => p.y < cv.height + 30);
    PS.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -3, p.w, 6); ctx.restore(); });
    if (PS.length) requestAnimationFrame(tick); else { fxRun = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  })();
}
</script>
