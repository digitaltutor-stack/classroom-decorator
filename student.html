<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내 이름 써보기 🌟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff9c4 0%, #ffe0f0 50%, #c8f0ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Jua', sans-serif;
    padding: 20px;
    overflow: hidden;
  }

  /* 배경 별 */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    font-size: 1.5rem;
    animation: float 3s ease-in-out infinite;
    opacity: 0.6;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(10deg); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.92);
    border-radius: 32px;
    padding: 40px 36px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 8px 40px rgba(255,150,180,0.25), 0 2px 8px rgba(0,0,0,0.08);
    text-align: center;
    border: 3px solid rgba(255,200,220,0.5);
  }

  .emoji-top {
    font-size: 4rem;
    margin-bottom: 8px;
    display: block;
    animation: bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: 2rem;
    color: #ff6b9d;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #888;
    margin-bottom: 28px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 24px;
  }

  input[type="text"] {
    width: 100%;
    font-family: 'Jua', sans-serif;
    font-size: 2.2rem;
    text-align: center;
    border: 4px solid #ffb3cc;
    border-radius: 20px;
    padding: 18px 16px;
    background: #fff9fb;
    color: #333;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 4px;
  }
  input[type="text"]:focus {
    border-color: #ff6b9d;
    box-shadow: 0 0 0 4px rgba(255,107,157,0.15);
  }
  input[type="text"]::placeholder {
    color: #ffb3cc;
    font-size: 1.4rem;
    letter-spacing: 0;
  }

  .btn {
    width: 100%;
    font-family: 'Jua', sans-serif;
    font-size: 1.8rem;
    padding: 18px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff6b9d, #ff9a3c);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,107,157,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 2px;
  }
  .btn:active {
    transform: scale(0.97);
    box-shadow: 0 3px 10px rgba(255,107,157,0.3);
  }
  .btn:disabled {
    background: #ccc;
    box-shadow: none;
    cursor: not-allowed;
  }

  /* 완료 화면 */
  .done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .done-name {
    font-size: 3.5rem;
    color: #ff6b9d;
    animation: popIn 0.5s cubic-bezier(0.68,-0.55,0.27,1.55);
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .done-msg {
    font-size: 1.6rem;
    color: #555;
  }
  .done-emoji {
    font-size: 5rem;
    animation: spin 0.6s ease-out;
  }
  @keyframes spin {
    0% { transform: rotate(-30deg) scale(0); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .retry-btn {
    margin-top: 8px;
    font-family: 'Jua', sans-serif;
    font-size: 1.1rem;
    padding: 12px 28px;
    border: 3px solid #ffb3cc;
    border-radius: 50px;
    background: white;
    color: #ff6b9d;
    cursor: pointer;
    transition: background 0.2s;
  }
  .retry-btn:hover { background: #fff0f5; }

  .msg {
    margin-top: 12px;
    font-size: 1rem;
    color: #aaa;
    min-height: 20px;
  }
  .msg.error { color: #ff4444; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card" id="inputCard">
  <span class="emoji-top">⌨️</span>
  <h1>내 이름 써보기</h1>
  <p class="subtitle">키보드로 내 이름을 입력해봐요!</p>

  <div class="input-wrap">
    <input type="text" id="nameInput" placeholder="이름을 써보세요" maxlength="10" autocomplete="off" autofocus>
  </div>

  <button class="btn" id="submitBtn" onclick="submitName()">✅ 다 썼어요!</button>
  <p class="msg" id="msg"></p>
</div>

<div class="card done-screen" id="doneCard">
  <span class="done-emoji">🎉</span>
  <p class="done-msg">내 이름은</p>
  <div class="done-name" id="doneName"></div>
  <p class="done-msg">정말 잘 썼어요! 👏</p>
  <button class="retry-btn" onclick="retry()">다시 써볼래요</button>
</div>

<script>
  // 배경 별 생성
  const starEmojis = ['⭐','🌟','✨','💫','🌈','🎀','🍀','🌸'];
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = starEmojis[i % starEmojis.length];
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.fontSize = (1 + Math.random()) + 'rem';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    starsEl.appendChild(s);
  }

  // 이름 저장 KEY (localStorage 대신 서버 대용으로 sessionStorage + 공유용 URL 파라미터)
  // 실제 수집은 teacher.html에서 polling으로 확인
  // 여기서는 간단히 localStorage에 배열로 추가 저장

  async function submitName() {
    const input = document.getElementById('nameInput');
    const msg = document.getElementById('msg');
    const name = input.value.trim();

    if (!name) {
      msg.textContent = '이름을 입력해주세요! 😊';
      msg.className = 'msg error';
      return;
    }
    if (name.length < 2) {
      msg.textContent = '이름을 두 글자 이상 써봐요!';
      msg.className = 'msg error';
      return;
    }

    document.getElementById('submitBtn').disabled = true;
    msg.textContent = '저장 중...';
    msg.className = 'msg';

    try {
      await window.storage.set('name_' + Date.now(), JSON.stringify({
        name: name,
        time: new Date().toLocaleTimeString('ko-KR')
      }), true); // shared = true → 선생님 페이지에서도 볼 수 있음

      // 완료 화면
      document.getElementById('inputCard').style.display = 'none';
      const doneCard = document.getElementById('doneCard');
      doneCard.style.display = 'flex';
      document.getElementById('doneName').textContent = name;

    } catch(e) {
      msg.textContent = '저장에 실패했어요. 다시 눌러봐요!';
      msg.className = 'msg error';
      document.getElementById('submitBtn').disabled = false;
    }
  }

  function retry() {
    document.getElementById('doneCard').style.display = 'none';
    document.getElementById('inputCard').style.display = 'block';
    document.getElementById('nameInput').value = '';
    document.getElementById('nameInput').focus();
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('msg').textContent = '';
  }

  // 엔터키 제출
  document.getElementById('nameInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitName();
  });
</script>
</body>
</html>
