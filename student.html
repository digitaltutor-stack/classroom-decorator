<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내 이름 써보기 🌟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff9c4 0%, #ffe0f0 50%, #c8f0ff 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.92); border-radius: 32px;
    padding: 40px 36px; width: 100%; max-width: 480px;
    box-shadow: 0 8px 40px rgba(255,150,180,0.25);
    text-align: center; border: 3px solid rgba(255,200,220,0.5);
  }
  .emoji-top { font-size: 4rem; margin-bottom: 8px; display: block; }
  h1 { font-size: 2rem; color: #ff6b9d; margin-bottom: 6px; }
  .subtitle { font-size: 1.1rem; color: #888; margin-bottom: 28px; }
  input[type="text"] {
    width: 100%; font-family: 'Jua', sans-serif;
    font-size: 2.2rem; text-align: center;
    border: 4px solid #ffb3cc; border-radius: 20px;
    padding: 18px 16px; background: #fff9fb; color: #333;
    outline: none; margin-bottom: 24px; letter-spacing: 4px;
  }
  input[type="text"]:focus { border-color: #ff6b9d; }
  input::placeholder { color: #ffb3cc; font-size: 1.4rem; letter-spacing: 0; }
  .btn {
    width: 100%; font-family: 'Jua', sans-serif;
    font-size: 1.8rem; padding: 18px; border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff6b9d, #ff9a3c);
    color: white; cursor: pointer; letter-spacing: 2px;
  }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .done-screen { display: none; flex-direction: column; align-items: center; gap: 16px; }
  .done-name { font-size: 3.5rem; color: #ff6b9d; }
  .done-msg { font-size: 1.6rem; color: #555; }
  .done-emoji { font-size: 5rem; }
  .retry-btn {
    font-family: 'Jua', sans-serif; font-size: 1.1rem;
    padding: 12px 28px; border: 3px solid #ffb3cc;
    border-radius: 50px; background: white; color: #ff6b9d; cursor: pointer;
  }
  .msg { margin-top: 12px; font-size: 1rem; color: #aaa; min-height: 20px; }
  .msg.error { color: #ff4444; }
</style>
</head>
<body>
<div class="card" id="inputCard">
  <span class="emoji-top">⌨️</span>
  <h1>내 이름 써보기</h1>
  <p class="subtitle">키보드로 내 이름을 입력해봐요!</p>
  <input type="text" id="nameInput" placeholder="이름을 써보세요" maxlength="10" autocomplete="off" autofocus>
  <button class="btn" id="submitBtn" onclick="submitName()">✅ 다 썼어요!</button>
  <p class="msg" id="msg"></p>
</div>
<div class="card done-screen" id="doneCard">
  <span class="done-emoji">🎉</span>
  <p class="done-msg">내 이름은</p>
  <div class="done-name" id="doneName"></div>
  <p class="done-msg">정말 잘 썼어요! 👏</p>
  <button class="retry-btn" onclick="retry()">다시 써볼래요</button>
</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7A98taJz8j_1WT2ggM5-GNXpjduMoDa_tHczL_LPizKnrLH2Lj8p8_lB1VYFKmJtbBA/exec';

async function submitName() {
  const input = document.getElementById('nameInput');
  const msg = document.getElementById('msg');
  const name = input.value.trim();
  if (!name) { msg.textContent = '이름을 입력해주세요! 😊'; msg.className = 'msg error'; return; }
  if (name.length < 2) { msg.textContent = '이름을 두 글자 이상 써봐요!'; msg.className = 'msg error'; return; }
  document.getElementById('submitBtn').disabled = true;
  msg.textContent = '저장 중...';
  msg.className = 'msg';
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ name: name })
    });
    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('doneCard').style.display = 'flex';
    document.getElementById('doneName').textContent = name;
  } catch(e) {
    msg.textContent = '저장에 실패했어요. 다시 눌러봐요!';
    msg.className = 'msg error';
    document.getElementById('submitBtn').disabled = false;
  }
}

function retry() {
  document.getElementById('doneCard').style.display = 'none';
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('nameInput').value = '';
  document.getElementById('nameInput').focus();
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('msg').textContent = '';
}
document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') submitName(); });
</script>
</body>
</html>
