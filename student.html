<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내 이름 써보기 🌟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff9c4 0%, #ffe0f0 50%, #c8f0ff 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.95); border-radius: 28px;
    padding: 28px 28px; width: 100%; max-width: 460px;
    box-shadow: 0 8px 40px rgba(255,150,180,0.2);
    border: 2.5px solid rgba(255,200,220,0.5);
  }
  .keyboard-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
  h1 { text-align: center; color: #ff6b9d; font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #aaa; font-size: 0.95rem; margin-bottom: 18px; }
  .label { font-size: 0.85rem; color: #bbb; margin-bottom: 6px; display: block; }
  .grade-wrap { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .grade-btn {
    font-family: 'Jua', sans-serif; font-size: 0.9rem;
    padding: 7px 13px; border: 2.5px solid #eee;
    border-radius: 50px; background: white; color: #aaa; cursor: pointer;
  }
  .grade-btn.active { border-color: #ff6b9d; color: #ff6b9d; background: #fff0f5; }
  input[type="number"], input[type="text"] {
    width: 100%; font-family: 'Jua', sans-serif;
    font-size: 1.5rem; text-align: center;
    border: 3px solid #ffb3cc; border-radius: 14px;
    padding: 12px; background: #fff9fb; color: #333;
    outline: none; margin-bottom: 14px;
  }
  input[type="text"] { font-size: 1.8rem; letter-spacing: 4px; }
  input:focus { border-color: #ff6b9d; }
  input::placeholder { color: #ffb3cc; font-size: 1rem; letter-spacing: 0; }
  textarea {
    width: 100%; font-family: 'Jua', sans-serif; font-size: 1.1rem;
    border: 3px solid #ffb3cc; border-radius: 14px;
    padding: 14px; background: #fff9fb; color: #333;
    outline: none; margin-bottom: 14px; resize: none; height: 80px; line-height: 1.6;
  }
  textarea:focus { border-color: #ff6b9d; }
  textarea::placeholder { color: #ffb3cc; font-size: 0.95rem; }
  .mood-wrap { display: flex; justify-content: space-around; margin-bottom: 18px; }
  .mood-btn {
    font-size: 2rem; background: none; border: 3px solid transparent;
    border-radius: 50%; width: 52px; height: 52px; cursor: pointer;
  }
  .mood-btn.active { border-color: #ff6b9d; background: #fff0f5; }
  .submit-btn {
    width: 100%; font-family: 'Jua', sans-serif;
    font-size: 1.5rem; padding: 16px; border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #ff6b9d, #ff9a3c);
    color: white; cursor: pointer; letter-spacing: 2px;
  }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
  .msg { margin-top: 10px; font-size: 1rem; color: #aaa; text-align: center; min-height: 20px; }
  .msg.error { color: #ff4444; }
  .done-screen { display: none; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .done-emoji { font-size: 5rem; }
  .done-name { font-size: 3rem; color: #ff6b9d; }
  .done-msg { font-size: 1.4rem; color: #555; }
  .retry-btn {
    font-family: 'Jua', sans-serif; font-size: 1.1rem;
    padding: 12px 28px; border: 3px solid #ffb3cc;
    border-radius: 50px; background: white; color: #ff6b9d; cursor: pointer;
  }
</style>
</head>
<body>

  <h1>내 이름 써보기</h1>
  <p class="subtitle">키보드로 내 이름을 입력해봐요!</p>

  <span class="label">학년</span>
  <div class="grade-wrap">
    <button class="grade-btn active" onclick="selectGrade(this,'1학년')">1학년</button>
    <button class="grade-btn" onclick="selectGrade(this,'2학년')">2학년</button>
    <button class="grade-btn" onclick="selectGrade(this,'3학년')">3학년</button>
    <button class="grade-btn" onclick="selectGrade(this,'4학년')">4학년</button>
    <button class="grade-btn" onclick="selectGrade(this,'5학년')">5학년</button>
    <button class="grade-btn" onclick="selectGrade(this,'6학년')">6학년</button>
  </div>

  <span class="label">번호</span>
  <input type="number" id="numInput" min="1" max="40" placeholder="번호">

  <span class="label">이름</span>
  <input type="text" id="nameInput" placeholder="이름을 써보세요" maxlength="10" autocomplete="off">

  <span class="label">✏️ 하고 싶은 말</span>
  <textarea id="msgInput" placeholder="선생님께 하고 싶은 말을 자유롭게 써봐요!"></textarea>

  <span class="label">오늘 기분은?</span>
  <div class="mood-wrap">
    <button class="mood-btn active" onclick="selectMood(this,'😊')">😊</button>
    <button class="mood-btn" onclick="selectMood(this,'😄')">😄</button>
    <button class="mood-btn" onclick="selectMood(this,'😐')">😐</button>
    <button class="mood-btn" onclick="selectMood(this,'😴')">😴</button>
    <button class="mood-btn" onclick="selectMood(this,'😢')">😢</button>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitName()">✅ 다 썼어요!</button>
  <p class="msg" id="msg"></p>
</div>

<div class="card done-screen" id="doneCard">
  <span class="done-emoji">🎉</span>
  <p class="done-msg">내 이름은</p>
  <div class="done-name" id="doneName"></div>
  <p class="done-msg">정말 잘 썼어요! 👏</p>
  <button class="retry-btn" onclick="retry()">다시 써볼래요</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdGODDgP2tjewoo1Hfr0qv64Z09xNBD71q2s1gO8LiezcOB4E32Zmd95bJH_fvgQJ-/exec';
let selectedGrade = '1학년';
let selectedMood = '😊';

function selectGrade(btn, grade) {
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedGrade = grade;
}

function selectMood(btn, mood) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedMood = mood;
}

async function submitName() {
  const name = document.getElementById('nameInput').value.trim();
  const num = document.getElementById('numInput').value.trim();
  const memo = document.getElementById('msgInput').value.trim();
  const msg = document.getElementById('msg');

  if (!name) { msg.textContent = '이름을 입력해주세요! 😊'; msg.className = 'msg error'; return; }
  if (name.length < 2) { msg.textContent = '이름을 두 글자 이상 써봐요!'; msg.className = 'msg error'; return; }
  if (!num) { msg.textContent = '번호를 입력해주세요!'; msg.className = 'msg error'; return; }

  document.getElementById('submitBtn').disabled = true;
  msg.textContent = '저장 중...';
  msg.className = 'msg';

  try {
    const params = new URLSearchParams({
      action: 'save',
      name: name,
      grade: selectedGrade,
      num: num,
      mood: selectedMood,
      memo: memo
    });
    await fetch(SCRIPT_URL + '?' + params.toString(), { mode: 'no-cors' });
    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('doneCard').style.display = 'flex';
    document.getElementById('doneName').textContent = name;
  } catch(e) {
    msg.textContent = '저장에 실패했어요. 다시 눌러봐요!';
    msg.className = 'msg error';
    document.getElementById('submitBtn').disabled = false;
  }
}

function retry() {
  document.getElementById('doneCard').style.display = 'none';
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('nameInput').value = '';
  document.getElementById('numInput').value = '';
  document.getElementById('msgInput').value = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('msg').textContent = '';
}
</script>
</body>
</html>
